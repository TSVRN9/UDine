# CI gate (issue #20). Runs on every PR and on push to main; each job below must pass or the
# check status goes red.
#
# Run the same checks locally:
#   pnpm --filter @udine/shared test        # shared unit tests (node --test)
#   pnpm --filter web check                 # svelte-check, type-only
#   cd mobile && npx tsc --noEmit           # mobile typecheck (don't run `expo lint` here — a
#                                            # bare first run bootstraps ESLint config as a side
#                                            # effect, see CLAUDE.md)
#   deno test --node-modules-dir=none --allow-env supabase/functions
#                                            # --node-modules-dir=none: without it, deno test
#                                            # detects pnpm-workspace.yaml and rewrites
#                                            # package.json. --allow-env: push.test.ts transitively
#                                            # imports npm:web-push, which reads an env var at
#                                            # module load.
#   cd web && npx playwright test           # e2e (needs `npx playwright install chromium` once).
#                                            # Add --headed or --debug to watch/step through it;
#                                            # `npx playwright show-report` opens the last HTML report.
#   supabase start && supabase test db      # pgTAP RLS/schema tests (issue #27) — needs Docker and
#                                            # the Supabase CLI (`npx supabase`). Runs against a
#                                            # local, throwaway Postgres with all migrations
#                                            # applied; never touches the live project. Follow with
#                                            # `supabase stop --no-backup` to tear down.
#
# web check/dev/preview all read PUBLIC_* vars via $env/static/public, which throws if unset — see
# web/.env.example and the "Create web/.env" step below; the e2e test never contacts Supabase, so
# placeholder values are fine.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @udine/shared test

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cp web/.env.example web/.env
      - run: pnpm --filter web check

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
        working-directory: mobile

  supabase-functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Recursively picks up every *.test.ts under supabase/functions/ (Deno's default test file
      # pattern) — future functions' tests are covered automatically, no per-function wiring here.
      - run: deno test --node-modules-dir=none --allow-env supabase/functions

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cp web/.env.example web/.env
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  supabase-rls-tests:
    # pgTAP suite (issue #27), replacing the one-time manual RLS verification noted in CLAUDE.md.
    # Runs against a local, Docker-based Supabase stack with all migrations applied — never the
    # live project. This job is meaningfully slower than the others (Docker pulls ~10 Supabase
    # service images on a cold cache, then Postgres init + migrations) — expect it to be the long
    # pole in this workflow, roughly 1-3 minutes depending on runner image cache state, versus
    # well under a minute for the Node/Deno-only jobs above. ubuntu-latest ships Docker preinstalled
    # so no extra setup is needed for that part.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - run: supabase start
      - run: supabase test db
      - run: supabase stop --no-backup
        if: always()
