# CI gate (issue #20) — REMOTE RUNS DISABLED (2026-08-19, owner request: hosted-runner usage).
# Triggers are workflow_dispatch-only; required-status-check branch protection was removed to match.
# The gate did not go away — it moved local: run every lane below on the PR head before merging,
# either directly with the host commands in this comment, or with CI parity via `gh act`
# (nektos/act; Docker required): `gh act -j <job>` from the repo root, e.g. `gh act -j shared-tests`.
# The `supabase-rls-tests` job runs Docker-in-Docker under act — prefer its host-direct form
# (`supabase start … && supabase test db`) instead. Re-enable remote CI by restoring the
# pull_request/push triggers below and re-adding the required status checks to branch protection.
#
# Run the same checks locally:
#   pnpm --filter @udine/shared test        # shared unit tests (node --test)
#   pnpm --filter web test                  # web unit tests (node --test, TZ=UTC pinned -- see
#                                            # web/src/lib/date.test.ts's header comment)
#   pnpm --filter web check                 # svelte-check, type-only
#   cd mobile && npx tsc --noEmit           # mobile typecheck (don't run `expo lint` here — a
#                                            # bare first run bootstraps ESLint config as a side
#                                            # effect, see CLAUDE.md)
#   pnpm --filter mobile test               # mobile unit tests (jest-expo)
#   deno test --node-modules-dir=none --allow-env supabase/functions
#                                            # --node-modules-dir=none: without it, deno test
#                                            # detects pnpm-workspace.yaml and rewrites
#                                            # package.json. --allow-env: push.test.ts transitively
#                                            # imports npm:web-push, which reads an env var at
#                                            # module load.
#   cd web && npx playwright test           # e2e (needs `npx playwright install chromium` once).
#                                            # Add --headed or --debug to watch/step through it;
#                                            # `npx playwright show-report` opens the last HTML report.
#   supabase start && supabase test db      # pgTAP RLS/schema tests (issue #27) — needs Docker and
#                                            # the Supabase CLI (`npx supabase`). Runs against a
#                                            # local, throwaway Postgres with all migrations
#                                            # applied; never touches the live project. Follow with
#                                            # `supabase stop --no-backup` to tear down. CI passes
#                                            # `-x ...` to `start` to skip services the tests don't
#                                            # need (see the job's own comment) — safe to skip
#                                            # locally too, or leave it off to poke around in Studio.
#
# web check/dev/preview all read PUBLIC_* vars via $env/static/public, which throws if unset — see
# web/.env.example and the "Create web/.env" step below; the e2e test never contacts Supabase, so
# placeholder values are fine.
name: CI

on:
  workflow_dispatch:

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @udine/shared test

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cp web/.env.example web/.env
      - run: pnpm --filter web check

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
        working-directory: mobile

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile test

  supabase-functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Recursively picks up every *.test.ts under supabase/functions/ (Deno's default test file
      # pattern) — future functions' tests are covered automatically, no per-function wiring here.
      - run: deno test --node-modules-dir=none --allow-env supabase/functions

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cp web/.env.example web/.env
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  supabase-rls-tests:
    # pgTAP suite (issue #27), replacing the one-time manual RLS verification noted in CLAUDE.md.
    # Runs against a local, Docker-based Postgres with all migrations applied — never the live
    # project. `supabase start` normally boots ~13 containers (auth, storage, realtime, Studio,
    # edge-runtime, analytics, ...) but `supabase test db` only ever talks to Postgres directly
    # (auth.users rows are inserted by the tests themselves, not via the gotrue API) — `-x` excludes
    # every service except the database itself, cutting this down to one container instead of ~13.
    # Still the slowest job in this workflow (Docker image pull + Postgres init + migrations vs. a
    # plain Node/Deno process for everything else), but no longer "~10 image pulls" slow.
    # ubuntu-latest ships Docker preinstalled so no extra setup is needed for that part.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - run: supabase stop --no-backup
        if: always()
