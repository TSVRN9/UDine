<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Libre+Franklin:wght@400;500;600&display=swap");
    body { margin: 0; font-family: "Libre Franklin", system-ui, sans-serif; background: #f3ead8; }
    a { color: #7c2430; } a:hover { color: #3b0a0f; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f3ead8; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; color: #241a14; position: relative;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px 20px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="min-width: 24px;"><path d="M15 5l-7 7 7 7" stroke="#3b0a0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; color: #3b0a0f; white-space: nowrap;">Hampshire</div>
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="flex-shrink: 0; margin-top: 2px;"><circle cx="8" cy="8" r="6.4" stroke="rgba(36,26,20,0.45)" stroke-width="1.5"></circle><path d="M8 7.4v3.4" stroke="rgba(36,26,20,0.45)" stroke-width="1.6" stroke-linecap="round"></path><circle cx="8" cy="5" r="0.95" fill="rgba(36,26,20,0.45)"></circle></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 30px; height: 30px; border: 1px solid rgba(36,26,20,0.2); border-radius: 999px; display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7l4 4" stroke="#3b0a0f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(36,26,20,0.6);">Tue, Aug 19</div>
      <div style="width: 30px; height: 30px; border: 1px solid rgba(36,26,20,0.2); border-radius: 999px; display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="#3b0a0f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid rgba(36,26,20,0.15); margin-bottom: 4px;">
    <div style="padding: 10px 0 8px 0; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(36,26,20,0.45); border-bottom: 3px solid transparent; margin-bottom: -1px;">Breakfast</div>
    <div style="padding: 10px 0 8px 0; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: #3b0a0f; border-bottom: 3px solid #c99a2e; margin-bottom: -1px;">Lunch</div>
    <div style="padding: 10px 0 8px 0; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(36,26,20,0.45); border-bottom: 3px solid transparent; margin-bottom: -1px;">Dinner</div>
    <div style="padding: 10px 0 8px 0; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(36,26,20,0.45); border-bottom: 3px solid transparent; margin-bottom: -1px;">Late</div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 1px; height: 16px; background: rgba(36,26,20,0.2);"></div>
    <div style="padding: 10px 0 8px 0; display: flex; align-items: center; gap: 6px; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(36,26,20,0.45); border-bottom: 3px solid transparent; margin-bottom: -1px;"><svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M3 5h10l-1 9H4L3 5z" stroke="rgba(36,26,20,0.45)" stroke-width="1.5" stroke-linejoin="round"></path><path d="M5.5 5V4a2.5 2.5 0 0 1 5 0v1" stroke="rgba(36,26,20,0.45)" stroke-width="1.5"></path></svg>Grab 'N Go</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0 36px;">
    <div style="width: 64px; height: 64px; border-radius: 999px; background: rgba(124,36,48,0.1); display: flex; align-items: center; justify-content: center; margin-bottom: 18px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 4L3 19h18L12 4z" stroke="#7c2430" stroke-width="1.8" stroke-linejoin="round"></path><path d="M12 10v4" stroke="#7c2430" stroke-width="1.8" stroke-linecap="round"></path><circle cx="12" cy="16.5" r="1" fill="#7c2430"></circle></svg>
    </div>
    <div style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; color: #3b0a0f; margin-bottom: 6px;">Menu didn't load</div>
    <div style="font-size: 13px; line-height: 1.5; color: rgba(36,26,20,0.65); text-align: center; margin-bottom: 20px;">UMass Dining didn't answer. Check your connection, or the menu for this date may not be posted yet.</div>
    <div style="background: #c99a2e; color: #3b0a0f; border-radius: 6px; height: 48px; padding: 0 32px; display: flex; align-items: center; gap: 10px; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" stroke="#3b0a0f" stroke-width="1.7" stroke-linecap="round"></path><path d="M13.5 2.5v2.6h-2.6" stroke="#3b0a0f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      Try again
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #3b0a0f; padding: 12px 20px 22px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 9l4-4 4 4" stroke="rgba(251,247,239,0.35)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div style="font-weight: 600; font-size: 15px; color: rgba(251,247,239,0.55);">Plate is empty</div>
      </div>
      <div style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: rgba(251,247,239,0.4);">your plate is safe — it lives on this phone</div>
    </div>
    <div style="background: rgba(201,154,46,0.35); color: rgba(59,10,15,0.6); border-radius: 6px; padding: 0 26px; height: 48px; display: flex; align-items: center; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 1px; text-transform: uppercase;">Log</div>
  </div>

</div>
</x-dc>
</body>
</html>
