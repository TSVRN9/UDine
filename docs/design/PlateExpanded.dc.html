        <div style="font-family: ui-monospace, Menlo, monospace; font-size: 18px; font-weight: 600; color: #3b0a0f;">14g</div>

    <div style="display: flex; align-items: center; gap: 12px; border: 1px dashed rgba(124,36,48,0.45); border-radius: 6px; padding: 12px 14px; min-height: 44px; box-sizing: border-box;">
