<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>UDine Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f7;--cell:#fff;--label:#000;--sec:#6c6c70;--tint:#881c1c;--tintbg:#f1e4e4;--sep:#c6c6c8;
  --fill:#eeeef0;--track:#e3e3e8;--chev:#9c9ca1;--hl:#d1d1d6;--red:#c4161c;
  --sat:54px;--sab:34px;
  --sheet:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.3,.64,1);--out:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{touch-action:manipulation}
body{display:grid;place-items:center;background:#dcdce1;font-family:-apple-system,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
  color:var(--label);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,.press:focus-visible{outline:3px solid #2f6fdb;outline-offset:2px}
.frame{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#000;
  box-shadow:0 0 0 10px #1c1c1e,0 30px 80px rgba(0,0,0,.3);isolation:isolate}
@media (max-width:500px){
  body{display:block;background:var(--bg)}
  .frame{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  :root{--sat:max(env(safe-area-inset-top),20px);--sab:max(env(safe-area-inset-bottom),12px)}
}
#probe{position:absolute;height:var(--sat);width:1px;visibility:hidden}
svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* presenter: everything the sheet sits on top of */
.presenter{position:absolute;inset:0;background:var(--bg);transform-origin:50% 0;overflow:hidden;will-change:transform}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 104px);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.view.on{opacity:1;visibility:visible;transition:opacity .2s}
.view::-webkit-scrollbar,.carousel::-webkit-scrollbar,.slist::-webkit-scrollbar{display:none}

.eyebrow{font-weight:600;font-size:15px;line-height:20px;color:var(--sec);margin:0 4px}
h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.9px;margin:0 4px 16px}
h2{font-size:20px;line-height:25px;font-weight:700;letter-spacing:-.45px;margin:28px 4px 10px}
h3{font-size:15px;line-height:20px;font-weight:600;color:var(--sec);margin:20px 16px 6px}
.group{background:var(--cell);border-radius:26px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 6px 8px 16px;background:var(--cell);width:100%;text-align:left}
.row+.row::before,.crow+.crow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0}
.t{flex:1;min-width:0}
.name{font-size:17px;line-height:22px;letter-spacing:-.41px}
.sub{font-size:15px;line-height:20px;color:var(--sec)}
.press{transition:background .25s cubic-bezier(.25,.1,.25,1)}
.press:active,.press.down{background:var(--hl);transition:none}
.chev{color:var(--chev);width:28px;display:grid;place-items:center;flex:none}
.tintx{color:var(--tint)}

/* totals */
.totals{padding:16px 20px 14px}
.kcal{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;display:inline-block;transform-origin:0 70%}
.kcal small{font-size:17px;font-weight:400;color:var(--sec);letter-spacing:-.41px}
.bump{animation:bump .45s var(--spring)}
@keyframes bump{from{transform:scale(1.07)}to{transform:none}}
.macros{font-size:15px;line-height:20px;color:var(--sec);margin-top:2px;font-variant-numeric:tabular-nums}
.meals{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:12px;position:relative}
.meals::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.meals div{font-size:13px;line-height:18px;color:var(--sec)}
.meals b{display:block;font-size:17px;line-height:22px;font-weight:600;color:var(--label);font-variant-numeric:tabular-nums}
.meals .now{color:var(--tint);font-weight:600}

/* past-plate carousel */
.carousel{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 2px;scroll-padding:0 16px;overscroll-behavior-x:contain}
.plate{flex:0 0 306px;scroll-snap-align:start;background:var(--cell);border-radius:26px;padding:16px 16px 14px 20px;display:flex;flex-direction:column;text-align:left}
.plate:only-child{flex-basis:100%}
.plate .ttl{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.41px}
.plate ul{list-style:none;margin:10px 0 12px;padding:0;flex:1}
.plate li{display:flex;gap:10px;font-size:15px;line-height:22px}
.plate li span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate li span+span{color:var(--sec);font-variant-numeric:tabular-nums}
.plate .foot{display:flex;align-items:center;gap:12px}
.plate .foot .sub{flex:1}
.cap{height:44px;padding:0 24px;border-radius:22px;background:var(--tint);color:#fff;font-weight:600;font-size:17px;letter-spacing:-.41px;
  transition:transform .3s var(--spring),background .2s;flex:none}
.cap:active{transform:scale(.96);transition:transform .12s var(--out)}
.cap[disabled]{background:var(--track);color:#6c6c70}

/* add / logged circles */
.add{width:44px;height:44px;display:grid;place-items:center;flex:none}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tintbg);color:var(--tint);transition:transform .28s var(--spring),background .2s,color .2s}
.add:active .dot{transform:scale(.86);transition:transform .1s var(--out)}
.add.on .dot{background:var(--tint);color:#fff}
.qty{font-size:17px;color:var(--sec);font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.qty.on{color:var(--tint);font-weight:600}
.ico{width:30px;height:30px;border-radius:9px;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none}

/* hall tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--tint);color:#fff;border-radius:26px;min-height:136px;padding:14px 16px 14px;text-align:left;display:flex;flex-direction:column;transition:transform .3s var(--spring)}
.tile:active{transform:scale(.97);transition:transform .12s var(--out)}
.tile .L{font-size:40px;line-height:44px;font-weight:700;flex:1}
.tile .N{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.45px}
.tile .S{font-size:13px;line-height:18px;color:#f2dede;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* swipe-to-delete rows */
.swipe{position:relative;overflow:hidden;touch-action:pan-y}
.swipe .under{position:absolute;inset:0;visibility:hidden;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-weight:600;font-size:17px}
.swipe.sw .under{visibility:visible}
.swipe .over{position:relative;will-change:transform}
.swipe+.swipe .over::before,.swipe+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0;z-index:1}
.swipe .over.snap{transition:transform .35s var(--sheet)}

/* tab bar */
.tabs{position:absolute;left:20px;right:20px;bottom:max(calc(var(--sab) - 8px),8px);height:62px;border-radius:31px;display:flex;padding:4px;z-index:3;
  background:rgba(250,250,252,.82);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 8px 30px rgba(0,0,0,.12),inset 0 0 0 .5px rgba(0,0,0,.06)}
.tab{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#3c3c43;transition:background .2s,color .2s}
.tab.on{color:var(--tint);background:rgba(0,0,0,.06)}
.tab:active{background:rgba(0,0,0,.1);transition:none}

/* sheet */
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9}
.sheet{position:absolute;left:0;right:0;top:0;background:var(--bg);border-radius:40px 40px 0 0;z-index:10;display:flex;flex-direction:column;
  transform:translateY(110%);will-change:transform;box-shadow:0 -8px 40px rgba(0,0,0,.14);overflow:hidden}
.anim{transition:transform .5s var(--sheet),opacity .5s var(--sheet),border-radius .5s var(--sheet)!important}
.shead{flex:none;touch-action:none;padding:6px 16px 8px}
.grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:0 auto 6px}
.snav{display:flex;align-items:center;gap:8px;min-height:44px}
.glass{width:44px;height:44px;border-radius:22px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 1px 6px rgba(0,0,0,.08);transition:transform .3s var(--spring)}
.glass:active{transform:scale(.92);transition:transform .12s var(--out)}
.stitle{flex:1;text-align:center;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.41px}
.stitle small{display:block;font-size:13px;line-height:18px;font-weight:400;color:var(--sec)}
.seg{position:relative;display:flex;height:44px;border-radius:22px;background:var(--track);padding:3px;margin-top:10px}
.seg button{flex:1;position:relative;z-index:1;font-size:13px;font-weight:500;color:#000;border-radius:19px}
.seg button.on{font-weight:600}
.thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:19px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .38s var(--spring)}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;background:var(--track);padding:0 6px 0 12px;margin-top:10px;color:var(--sec)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;letter-spacing:-.41px;color:#000;outline:none;height:44px;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:#55555a}
.clear{width:44px;height:44px;display:none;place-items:center;color:#8e8e93}
.search.has .clear{display:grid}
.slist{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px 130px}
.sh{position:sticky;top:0;z-index:2;margin:0 -16px;padding:14px 20px 8px;font-size:20px;line-height:25px;font-weight:700;letter-spacing:-.45px;
  background:rgba(242,242,247,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.crow{position:relative;display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 4px 6px 8px;background:var(--cell);cursor:pointer}
.cnt{width:44px;height:44px;display:grid;place-items:center;flex:none}
.cnt i{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px #8e8e93;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:15px;color:#fff;
  transition:background .18s,box-shadow .18s,transform .3s var(--spring);font-variant-numeric:tabular-nums}
.crow.on .cnt i{background:var(--tint);box-shadow:none}
.crow.tick .cnt i{animation:tick .32s var(--spring)}
@keyframes tick{from{transform:scale(.7)}to{transform:none}}
.dec{width:44px;height:44px;display:grid;place-items:center;flex:none;opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .15s,transform .28s var(--spring)}
.dec span{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.crow.on .dec{opacity:1;transform:none;pointer-events:auto}
.dec:active span{background:var(--hl)}
.crow .name{font-size:17px}
.empty{padding:28px 20px 8px;text-align:center;color:var(--sec);font-size:15px;line-height:20px}
.sfoot{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:16px 16px calc(var(--sab) + 4px);background:linear-gradient(rgba(242,242,247,0),var(--bg) 22px);will-change:transform}
.sfoot .cap{width:100%;height:52px;border-radius:26px}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:calc(max(calc(var(--sab) - 8px),8px) + 74px);min-height:52px;border-radius:26px;z-index:20;
  background:rgba(28,28,30,.95);color:#fff;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 20px;font-size:15px;line-height:20px;
  transform:translateY(160%);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .2s;touch-action:none}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast.up{bottom:calc(var(--sab) + 12px)}
.toast span{flex:1}
.toast button{height:44px;padding:0 14px;border-radius:22px;color:#ffb3b0;font-weight:600;font-size:17px}
.toast button:active{background:rgba(255,255,255,.12)}

/* quantity popover */
.popdim{position:absolute;inset:0;z-index:15;display:none}
.pop{position:absolute;right:16px;z-index:16;display:flex;gap:4px;padding:4px;border-radius:26px;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.22);
  transform-origin:90% 0;transform:scale(.85);opacity:0;pointer-events:none;transition:transform .3s var(--spring),opacity .15s}
.pop.on{transform:none;opacity:1;pointer-events:auto}
.pop button{min-width:48px;height:48px;border-radius:24px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.pop button:active{background:var(--hl)}
.pop button.cur{background:var(--tint);color:#fff}
.pop button.rm{color:var(--red);padding:0 14px;font-weight:500}

/* pushed detail */
.push{position:absolute;inset:0;z-index:4;background:var(--bg);transform:translateX(100%);overflow-y:auto;
  padding:calc(var(--sat) + 4px) 16px calc(var(--sab) + 104px);visibility:hidden;transition:transform .45s var(--sheet),visibility 0s .45s}
.push.on{transform:none;visibility:visible;box-shadow:-10px 0 30px rgba(0,0,0,.08);transition:transform .45s var(--sheet)}
.choice{display:block;width:100%;text-align:left;background:var(--cell);border-radius:26px;padding:22px 20px;margin-bottom:12px;min-height:110px;transition:transform .3s var(--spring)}
.choice:active{transform:scale(.97);transition:transform .12s var(--out)}
.choice .name{font-size:20px;line-height:25px;font-weight:600}
.sw{width:51px;height:31px;border-radius:16px;background:#e3e3e8;position:relative;flex:none;margin-right:10px;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.sw.on{background:var(--tint)}
.sw.on::after{transform:translateX(20px)}
.link{height:44px;padding:0 14px;border-radius:22px;background:var(--tintbg);color:var(--tint);font-weight:600;font-size:15px;flex:none}
.link:active{background:#e6cfcf}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:0s!important}
  .anim{transition:opacity .2s linear!important}
  .view{transition:opacity .2s linear!important}
  .toast,.pop{transition:opacity .2s linear!important}
}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div id="probe"></div>
  <div class="presenter" id="presenter">
    <main class="view on" id="v-today"></main>
    <main class="view" id="v-halls"></main>
    <main class="view" id="v-you"></main>
    <section class="push" id="push"></section>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="today"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg>Today</button>
      <button class="tab" data-tab="halls"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 3v6a3 3 0 0 0 6 0V3M9 3v18M18 21V3c-2.2 1.2-3.5 4-3.5 8.5H18"/></svg>Halls</button>
      <button class="tab" data-tab="you"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.8 4.2-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg>You</button>
    </nav>
  </div>
  <div class="dim" id="dim"></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog">
    <div class="shead" id="shead">
      <div class="grab"></div>
      <div class="snav">
        <button class="glass" id="sclose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="stitle" id="stitle"></div>
        <span style="width:44px"></span>
      </div>
      <div class="seg" id="seg"><span class="thumb" id="thumb"></span></div>
      <label class="search" id="searchbox"><svg width="18" height="18" viewBox="0 0 24 24" stroke-width="2.4"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search">
        <button class="clear" id="qclear" aria-label="Clear search"><svg width="18" height="18" viewBox="0 0 24 24" stroke-width="2.4"><path d="M7 7l10 10M17 7L7 17"/></svg></button></label>
    </div>
    <div class="slist" id="slist"></div>
    <div class="sfoot" id="sfoot"><button class="cap" id="logbtn" disabled>Log lunch</button></div>
  </section>
  <div class="popdim" id="popdim"></div>
  <div class="pop" id="pop"></div>
  <div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tundo">Undo</button></div>
</div>

// ---------- data ----------
const IDX={};
for(const h of HALLS){IDX[h]={};for(const [st,ds] of MENU[h])for(const x of ds)IDX[h][x[0]]={n:x[0],cal:x[1],p:x[2],c:x[3],f:x[4],srv:x[5],diet:x[6],st}}

const fq=q=>q===.5?'½':q%1?Math.floor(q)+'½':String(q);
const r1=x=>Math.round(x*10)/10;
const gr=x=>{const v=r1(x);return (Number.isInteger(v)?v:v.toFixed(1))+' g'};
const sum=items=>items.reduce((a,i)=>(a.cal+=i.cal*i.q,a.p+=i.p*i.q,a.c+=i.c*i.q,a.f+=i.f*i.q,a),{cal:0,p:0,c:0,f:0});
const dt=d=>new Date(d+'T12:00:00');
const longDate=d=>dt(d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const rel=d=>{const n=Math.round((dt(TODAY)-dt(d))/864e5);return n===1?'yesterday':n<7?dt(d).toLocaleDateString('en-US',{weekday:'long'}):dt(d).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const t12=t=>{const [h,m]=t.split(':').map(Number);return `${(h+11)%12+1}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`};
const todayE=()=>log.filter(e=>e.d===TODAY);
const lunchE=()=>todayE().filter(e=>e.meal===MEAL);
const loggedQ=(n,hall)=>lunchE().filter(e=>!hall||e.hall===hall).reduce((a,e)=>a+e.items.filter(i=>i.n===n).reduce((b,i)=>b+i.q,0),0);
const clone=()=>JSON.parse(JSON.stringify(log));
const cal=x=>Math.round(x)+' cal';

// hall you eat this meal at most, derived from the on-device log only
function favHall(){const c={};for(const e of log)if(e.meal===MEAL&&e.d<TODAY)c[e.hall]=(c[e.hall]||0)+1;
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||null}

// usuals: logged 2+ times before today, matched against what's served right now
function usuals(){
  const m={};
  for(const e of log)if(e.d<TODAY)for(const i of e.items){const u=m[i.n]??={n:i.n,count:0,qs:{},halls:{}};u.count++;u.qs[i.q]=(u.qs[i.q]||0)+1;u.halls[e.hall]=(u.halls[e.hall]||0)+1}
  return Object.values(m).filter(u=>u.count>=2).map(u=>{
    const pref=Object.keys(u.halls).sort((a,b)=>u.halls[b]-u.halls[a]);
    const hall=[...pref,...HALLS].find(h=>IDX[h][u.n]);if(!hall)return null;
    const q=+Object.keys(u.qs).sort((a,b)=>u.qs[b]-u.qs[a])[0];
    return {n:u.n,hall,q,count:u.count,d:IDX[hall][u.n]};
  }).filter(Boolean).sort((a,b)=>b.count-a.count).slice(0,6);
}
// past plates at this meal whose every dish is on that hall's menu right now
function plates(){
  const fav=favHall(),seen=new Set(),hc={};
  for(const e of log)if(e.meal===MEAL)hc[e.hall]=(hc[e.hall]||0)+1;
  return log.filter(e=>e.d<TODAY&&e.meal===MEAL&&e.items.every(i=>IDX[e.hall][i.n]))
    .sort((a,b)=>(hc[b.hall]-hc[a.hall])||b.d.localeCompare(a.d))
    .filter(e=>{const k=e.hall+'|'+e.items.map(i=>i.n+i.q).sort().join();if(seen.has(k))return false;seen.add(k);return true})
    .slice(0,4);
}

// ---------- logging with undo ----------
function commit(fn,msg){const before=clone();fn();renderAll();toast(msg,()=>{log=before;renderAll();vib(8)})}
function addTo(hall,items){
  let e=lunchE().find(x=>x.hall===hall);
  if(!e){e={id:++uid,d:TODAY,meal:MEAL,hall,t:'12:40',items:[]};log.push(e)}
  for(const it of items){const ex=e.items.find(i=>i.n===it.n);ex?ex.q+=it.q:e.items.push({...it})}
}
const live=(hall,n,q)=>{const d=IDX[hall][n];return {n,q,cal:d.cal,p:d.p,c:d.c,f:d.f}};
function setLogged(hall,n,q){
  for(const e of lunchE().filter(x=>x.hall===hall)){const i=e.items.find(i=>i.n===n);if(i)i.q=q;e.items=e.items.filter(i=>i.q>0)}
  log=log.filter(e=>e.items.length);
}
function logPlate(e){
  const items=e.items.map(i=>live(e.hall,i.n,i.q));
  commit(()=>addTo(e.hall,items),`Logged lunch, ${cal(sum(items).cal)}`);vib([10,40,16]);
}
function logUsual(u,q){
  const prev=loggedQ(u.n,u.hall);
  if(prev){commit(()=>setLogged(u.hall,u.n,q),q?`${u.n} ×${fq(q)}`:`Removed ${u.n}`);vib(q?8:[6,30,6]);return}
  const it=live(u.hall,u.n,q);
  commit(()=>addTo(u.hall,[it]),`Logged ${u.n}${q!==1?' ×'+fq(q):''}, ${cal(it.cal*q)}`);vib(10);
}

let shownCal=0;
function totalsCard(){
  const t=sum(todayE().flatMap(e=>e.items)),per=m=>sum(todayE().filter(e=>e.meal===m).flatMap(e=>e.items)).cal;
  return `<div class="group totals"><div class="kcal" id="kcal"><span id="kn">${Math.round(shownCal)}</span> <small>cal</small></div>
    <div class="macros">${gr(t.p)} protein, ${gr(t.c)} carbs, ${gr(t.f)} fat</div>
    <div class="meals">${MEALS.map(m=>{const v=per(m);return `<div class="${m===MEAL?'now':''}">${m[0].toUpperCase()+m.slice(1)}<b>${v?Math.round(v):'–'}</b></div>`}).join('')}</div></div>`;
}
function tweenCal(){
  const to=sum(todayE().flatMap(e=>e.items)).cal,el=$('#kn');if(!el){shownCal=to;return}
  const from=shownCal;shownCal=to;if(Math.round(from)===Math.round(to)||RM){el.textContent=Math.round(to);return}
  const k=$('#kcal');k.classList.remove('bump');void k.offsetWidth;k.classList.add('bump');
  const t0=performance.now(),step=t=>{const p=Math.min(1,(t-t0)/480),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step);
}

  if(s==='checklist'||s==='empty-checklist')openSheet({mode:'after',hall:W},false);
  if(s==='checklist-picked'){openSheet({mode:'after',hall:W},false);S.sel[W]={'Beef Brisket Noodle Bowl':1,'Golden BBQ Chicken Thigh':2};renderList();updateFoot()}
  if(s==='checklist-search'||s==='empty-search'){openSheet({mode:'after',hall:W,q:'bris'},false)}
  if(s==='checklist-nomatch'){openSheet({mode:'after',hall:W,q:'pho'},false)}
  if(s==='again'){const e=tue();openSheet({mode:'again',hall:e.hall,prefill:e.items,pinnedTitle:`${e.hall} lunch, ${rel(e.d)}`},false)}
  if(s==='logged')logPlate(tue());
  if(s==='qty'){requestAnimationFrame(()=>{const r=$('[data-u="0"]');const u=usuals()[0];pop(r,u.q,false,q=>logUsual(u,q))})}
  if(s==='you')tab('you');
  if(s==='halls')tab('halls');
  if(s==='rank'){tab('you');rankScreen()}
  if(s==='empty-logged'){addTo(W,[live(W,'Beef Brisket Noodle Bowl',1),live(W,'Golden BBQ Chicken Thigh',2)]);shownCal=0;renderAll();toast('Logged lunch, 404 cal',()=>{})}
})();
</script>
