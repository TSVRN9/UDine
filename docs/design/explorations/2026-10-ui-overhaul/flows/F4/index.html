<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<title>UDine Tray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f7;--cell:#fff;--label:#000;--sec:#6c6c70;--tint:#881c1c;--sep:#c6c6c8;--track:#e3e3e8;
  --tintbg:#f1e4e4;--press:#d1d1d6;--step:#eeeef0;--onTray:#fff;--onTray2:rgba(255,255,255,.8);
  --st:max(env(safe-area-inset-top,0px),12px);--sb:env(safe-area-inset-bottom,0px);
  --font:-apple-system,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#d9d9de;font-family:var(--font);color:var(--label);-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center;overflow:hidden}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);border-radius:48px;box-shadow:0 30px 80px rgba(0,0,0,.25);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;isolation:isolate}
@media (max-width:500px){
  body{display:block;position:fixed;inset:0;background:var(--bg)}
  #app{position:fixed;inset:0;width:auto;height:auto;border-radius:0;box-shadow:none}
}
/* header */
#hdr{position:absolute;left:0;right:0;top:0;padding-top:var(--st);z-index:3;background:var(--bg);will-change:transform}
#titles{position:relative;height:52px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.ttl{position:absolute;left:0;top:6px;height:44px;line-height:44px;font-size:28px;font-weight:700;letter-spacing:-.6px;white-space:nowrap;transform-origin:50% 60%;will-change:transform,opacity}
#rrow{display:flex;align-items:center;gap:8px;padding:2px 16px 8px;height:54px}
#ruler{position:relative;flex:1;height:44px;overflow:hidden;border-radius:22px;background:#e9e9ee;touch-action:none;cursor:grab;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
#rtrack{position:absolute;left:0;top:0;height:44px;will-change:transform}
.band{position:absolute;top:5px;height:34px;border-radius:17px;background:var(--track);display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:15px;font-weight:600;color:#3a3a3e;white-space:nowrap;transition:background-color .2s,box-shadow .2s,color .2s}
.band small{font-size:13px;font-weight:400;color:#545458}
.band.on{background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.now{position:absolute;bottom:2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--tint)}
#needle{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;pointer-events:none}
#needle::before,#needle::after{content:"";position:absolute;left:0;width:2px;height:7px;border-radius:1px;background:var(--tint)}
#needle::before{top:0}#needle::after{bottom:0}
.glass{width:44px;height:44px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:transform .3s cubic-bezier(.34,1.3,.64,1),background-color .15s}
.glass:active,.glass.pr{transform:scale(.92);transition-duration:.12s}
.glass.on{background:var(--tint);color:#fff}
.glass svg{width:22px;height:22px}
/* pager */
#pager{position:absolute;left:0;right:0;bottom:0;overflow:hidden;z-index:1;will-change:transform}
#ptrack{position:absolute;inset:0;will-change:transform}
.page{position:absolute;top:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  touch-action:pan-y;scroll-snap-type:y proximity;scroll-padding-top:6px;padding:6px 16px 0}
.page::-webkit-scrollbar{display:none}
.page.fade{transition:opacity .22s cubic-bezier(.2,0,0,1)}
.st h2{margin:0;padding:14px 4px 8px;font-size:20px;line-height:25px;font-weight:700;letter-spacing:-.4px;scroll-snap-align:start}
.st:first-child h2{padding-top:4px}
.grp{background:var(--cell);border-radius:22px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;min-height:64px;padding:9px 8px 9px 16px;gap:8px;cursor:pointer;transition:background-color .25s cubic-bezier(.25,.1,.25,1)}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row.pr{background:var(--press);transition:none}
.row.ghosted{opacity:.3}
.rt{flex:1;min-width:0}
.nm{font-size:17px;line-height:22px;letter-spacing:-.41px}
.nm .fav{display:inline-block;width:14px;height:14px;margin-left:6px;vertical-align:-1px;color:var(--tint)}
.mc{font-size:15px;line-height:20px;color:var(--sec);margin-top:1px}
.ctl{position:relative;width:44px;height:44px;flex:none}
.row.has .ctl{width:96px}
.add{position:absolute;right:0;top:0;width:44px;height:44px;display:grid;place-items:center;transition:transform .28s cubic-bezier(.34,1.3,.64,1),opacity .15s}
.add i{width:30px;height:30px;border-radius:15px;background:var(--tintbg);color:var(--tint);display:grid;place-items:center}
.add svg{width:16px;height:16px}
.stp{position:absolute;right:0;top:0;width:96px;height:44px;border-radius:22px;background:var(--step);display:flex;align-items:center;transform-origin:100% 50%;
  transition:transform .28s cubic-bezier(.34,1.3,.64,1),opacity .15s;opacity:0;transform:scale(.5);pointer-events:none}
.stp button{width:44px;height:44px;display:grid;place-items:center;color:#000}
.stp button:active{opacity:.45}
.stp b{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--tint);font-variant-numeric:tabular-nums}
.row.has .add{opacity:0;transform:scale(.4)}
.row.has .stp{opacity:1;transform:none;pointer-events:auto}
.closed{padding:80px 20px 0;text-align:center}
.closed p{font-size:17px;line-height:22px;margin:0 0 20px}
.closed .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{height:44px;padding:0 20px;border-radius:22px;background:#fff;font-size:17px;font-weight:600;color:var(--tint);box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .3s cubic-bezier(.34,1.3,.64,1)}
.pill:active{transform:scale(.96);transition-duration:.12s}
/* plain pages */
.plain h3{margin:22px 4px 8px;font-size:20px;font-weight:700;letter-spacing:-.4px}
.plain .date{margin:4px 4px 0;font-size:15px;color:var(--sec)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:10px 16px;position:relative;font-size:17px;letter-spacing:-.41px}
.li+.li::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.li span:last-child{color:var(--sec);text-align:right;flex:none}
.li.tap{cursor:pointer;color:var(--tint);width:100%;text-align:left}
.li.tap:active{background:var(--press)}
.li small{display:block;font-size:15px;color:var(--sec)}
.tot{display:grid;grid-template-columns:1fr 1fr}
.tot .li{border:0}
.tot .li+.li::before{display:none}
.h2h{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h2h button{min-height:88px;border-radius:22px;background:#fff;padding:14px;text-align:left;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.41px;transition:transform .3s cubic-bezier(.34,1.3,.64,1),background-color .15s}
.h2h button:active{transform:scale(.96);background:var(--press);transition-duration:.12s}
.h2h small{display:block;font-weight:400;font-size:15px;color:var(--sec);margin-top:4px}
.empty{padding:14px 16px;font-size:15px;color:var(--sec)}
/* station rail */
#rail{position:absolute;left:0;right:0;bottom:0;height:48px;z-index:4;touch-action:none;cursor:grab;will-change:transform,opacity;
  background:rgba(242,242,247,.86);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
#rtrk{position:absolute;left:0;top:0;height:48px;display:flex;white-space:nowrap;will-change:transform}
.chip{height:48px;line-height:46px;padding:0 13px;font-size:15px;font-weight:600;color:var(--sec);transition:color .12s}
.chip.on{color:#000}
#rdot{position:absolute;left:50%;top:3px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--tint)}
/* dim */
#dim{position:absolute;inset:0;z-index:5;background:#000;opacity:0;pointer-events:none;will-change:opacity}
/* tray */
#tray{position:absolute;left:6px;right:6px;top:0;z-index:6;border-radius:30px 30px 0 0;background:var(--tint);color:var(--onTray);touch-action:none;will-change:transform;
  box-shadow:0 -6px 28px rgba(80,10,10,.22),inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(0,0,0,.08)}
#tray.hot{background:#9a2424}
.grab{position:absolute;left:50%;top:6px;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:rgba(255,255,255,.45)}
#tc{position:absolute;left:0;right:0;top:0;padding:16px 12px 0 16px;will-change:opacity}
.toks{display:flex;flex-wrap:wrap;gap:6px;max-height:78px;overflow:hidden;margin-bottom:10px}
.toks:empty{display:none}
.tok{height:36px;max-width:170px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:18px;background:#fff;color:#000;font-size:15px;font-weight:500;
  transition:transform .32s cubic-bezier(.34,1.4,.64,1),opacity .2s}
.tok span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok b{color:var(--tint);font-weight:700;flex:none}
.tok.pending{opacity:0;transform:scale(.4)}
.tok.bump{transform:scale(1.08)}
.tok.gone,.ti.gone{opacity:0;transform:translateY(-26px) scale(.92);transition:transform .3s cubic-bezier(.2,0,0,1),opacity .25s}
.sum{display:flex;align-items:center;gap:12px;min-height:52px}
.sum .t{flex:1;min-width:0}
.sum .a{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.41px;font-variant-numeric:tabular-nums}
.sum .b{font-size:15px;line-height:20px;color:var(--onTray2);font-variant-numeric:tabular-nums}
.tb{height:44px;min-width:44px;padding:0 22px;border-radius:22px;background:#fff;color:var(--tint);font-size:17px;font-weight:600;flex:none;display:grid;place-items:center;
  transition:transform .3s cubic-bezier(.34,1.3,.64,1)}
.tb:active,.tb.pr{transform:scale(.94);transition-duration:.12s}
.tb.ghost{background:rgba(255,255,255,.16);color:#fff;padding:0}
.tb svg{width:22px;height:22px}
.ok{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:6px}
#tx{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;padding:22px 12px 0;opacity:0;pointer-events:none;will-change:opacity}
#tray.open #tx{pointer-events:auto}
#tray.open #tc{pointer-events:none}
.xh{padding:0 6px 12px}
.xh h2{margin:0;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.6px}
.xh p{margin:2px 0 0;font-size:15px;color:var(--onTray2)}
.tlist{flex:0 1 auto;min-height:0;color:#000;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;border-radius:22px}
.tlist .grp{border-radius:22px}
.ti{will-change:transform}
.ti .row{cursor:default}
.ti .stp{opacity:1;transform:none;pointer-events:auto;position:static}
.srch{display:flex;align-items:center;gap:8px;height:44px;margin:10px 0 0;padding:0 14px;border-radius:22px;background:rgba(255,255,255,.16)}
.srch svg{width:18px;height:18px;flex:none;opacity:.85}
.srch input{flex:1;min-width:0;height:44px;border:0;background:none;color:#fff;font:inherit;font-size:17px;outline:none}
.srch input::placeholder{color:rgba(255,255,255,.78)}
.xt{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:14px 6px 4px}
.xt div{font-size:13px;color:var(--onTray2)}
.xt b{display:block;font-size:17px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.xd{padding:6px 6px 12px;font-size:15px;color:var(--onTray2)}
.logbig{height:52px;border-radius:26px;background:#fff;color:var(--tint);font-size:17px;font-weight:700;margin-bottom:calc(var(--sb) + 10px);flex:none;
  transition:transform .3s cubic-bezier(.34,1.3,.64,1)}
.logbig:active{transform:scale(.97);transition-duration:.12s}
.logbig:disabled{opacity:.5}
.cust{display:flex;gap:8px;padding:10px 12px 12px 16px;align-items:center}
.cust input{width:96px;height:44px;border-radius:12px;border:0;background:var(--step);font:inherit;font-size:17px;padding:0 10px}
/* lift */
#layer{position:absolute;inset:0;z-index:8;pointer-events:none}
.card{position:absolute;left:0;top:0;background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 18px 40px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.1);will-change:transform}
.card .mc{white-space:normal}
.fly{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:11px;background:var(--tint);box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.25);will-change:transform}
#heart{position:absolute;right:16px;top:calc(var(--st) + 112px);z-index:7;width:64px;height:64px;border-radius:32px;background:#fff;color:var(--tint);display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.16);opacity:0;transform:scale(.5);pointer-events:none;transition:transform .3s cubic-bezier(.34,1.4,.64,1),opacity .18s}
#heart svg{width:28px;height:28px}
#heart.show{opacity:1;transform:none}
#heart.hot{transform:scale(1.18);background:var(--tint);color:#fff}
/* filter menu */
#fmenu{position:absolute;right:16px;top:calc(var(--st) + 108px);z-index:9;width:230px;background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.2);
  overflow:hidden;transform-origin:92% 0;transform:scale(.3);opacity:0;pointer-events:none;transition:transform .34s cubic-bezier(.34,1.25,.64,1),opacity .16s}
#fmenu.show{transform:none;opacity:1;pointer-events:auto}
#fmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;height:48px;padding:0 16px;font-size:17px;position:relative}
#fmenu button+button::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
#fmenu button:active{background:var(--press)}
#fmenu svg{width:18px;height:18px;color:var(--tint);opacity:0}
#fmenu .on svg{opacity:1}
:focus-visible{outline:3px solid #2f6fde;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div id="titles"></div>
    <div id="rrow">
      <div id="ruler" role="slider" aria-label="Meal" tabindex="0"><div id="rtrack"></div><div id="needle"></div></div>
      <button class="glass" id="fbtn" aria-label="Filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
  </header>
  <div id="pager"><div id="ptrack"></div></div>
  <div id="rail" aria-label="Stations"><div id="rtrk"></div><i id="rdot"></i></div>
  <div id="dim"></div>
  <div id="tray">
    <i class="grab"></i>
    <div id="tc"></div>
    <div id="tx"></div>
  </div>
  <div id="heart" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2.1 0 3.6 1.2 5.4 3.2C13.8 6.2 15.3 5 17.4 5 21 5 23 8.6 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg></div>
  <div id="fmenu" role="menu"></div>
  <div id="layer"></div>
</div>

  rail.style.transform = `translate3d(0,${-railLift}px,0)`;
  rail.style.opacity = railFade * clamp(1 - p * 3, 0, 1);
  rail.style.pointerEvents = railFade > .5 && p < .1 ? '' : 'none';
}
function trayTo(v, vel = 0, resp = .48, damp = .82) {
  tSpring && tSpring.stop();
  tSpring = spring({from: trayV, to: v, v: vel, response: resp, damping: damp, onUpdate: setTray, onDone: () => tSpring = null});
}
function openTray(o, vel = 0) {
  trayOpen = o;
  if (o) { renderTx(); buzz(8); } else { tx.querySelector('input')?.blur(); }
  trayTo(o ? trayExp() : restH, vel);
}
function landTray(vy = 300) { if (!trayOpen) trayTo(restH, -Math.min(900, 200 + Math.abs(vy) * .4), .42, .55); buzz(12); }
let tBase;
gesture(trayEl, {
  axis: 'y', slop: 6,
  skip(e) { if (e.target.closest('input')) return true; const l = e.target.closest('.tlist'); return l && l.scrollHeight > l.clientHeight + 2; },
  start() { tSpring && tSpring.stop(); tBase = trayV; },
  move(dx, dy) {
    let v = tBase - dy; const lo = restH, hi = trayExp();
    if (v > hi) v = hi + rubber(v - hi, H); if (v < lo) v = lo - rubber(lo - v, 160);
    setTray(v);
  },
  end(vx, vy) {
    const proj = trayV - vy * .18;
    const o = Math.abs(proj - trayExp()) < Math.abs(proj - restH);
    trayOpen = o; if (o) renderTx();
    trayTo(o ? trayExp() : restH, -vy);
    if (o) buzz(8);
  },
  tap(e) { if (!trayOpen && !e.target.closest('button')) openTray(true); },
});
dim.addEventListener('click', () => openTray(false));

function trayItems() { return [...S.tray.values()]; }
function renderTray(newKey, fromEl, opts = {}) {
  const items = trayItems(), sum = sumOf(items), today = sumOf(S.log);
  const prevRest = restH;
  if (S.logged) {
    tc.innerHTML = `<div class="sum"><div class="t"><div class="a"><span class="ok">${svg.check}</span>Logged ${S.logged.n} ${S.logged.n === 1 ? 'item' : 'items'}</div><div class="b">Today <span id="roll">${fmtCal(S.logged.before)}</span> cal</div></div><button class="tb ghost" id="undo" style="padding:0 18px">Undo</button></div>`;
  } else if (!items.length) {
    tc.innerHTML = `<div class="sum"><div class="t"><div class="a">Today</div><div class="b">${fmtCal(today.cal)} cal, ${fmtN(today.p)} g protein</div></div><button class="tb ghost" id="tsearch" aria-label="Search all halls">${svg.search}</button></div>`;
  } else {
    const shown = items.slice(-5).reverse(), more = items.length - shown.length;
    tc.innerHTML = `<div class="toks">${shown.map(it => `<span class="tok${it.key === newKey && (fromEl || opts.silent) ? ' pending' : ''}" data-k="${esc(it.key)}"><span>${esc(it.d[0])}</span>${it.q !== 1 ? `<b>×${fmtQ(it.q)}</b>` : ''}</span>`).join('')}${more ? `<span class="tok"><span>${more} more</span></span>` : ''}</div>
<div class="sum"><div class="t"><div class="a">${fmtQ(sum.n)} ${sum.n === 1 ? 'item' : 'items'}, ${fmtCal(sum.cal)} cal</div><div class="b">${fmtN(sum.p)} g protein</div></div><button class="tb" id="tlog">Log</button></div>`;
  }
  restH = tc.offsetHeight + 8 + sbPx();
  renderTx();
  if (!G.lifted && !trayOpen && !G.lock) trayTo(restH, 0, .44, .78);
  pageEls.slice(1, 5).forEach(sizeSpacer);
  // flight from the row's control into the token
  if (newKey && fromEl && !opts.silent) {
    const tok = tc.querySelector(`.tok[data-k="${CSS.escape(newKey)}"]`);
    if (!tok) return;
    if (RM || trayOpen) { tok.classList.remove('pending'); return; }
    if (!tok.classList.contains('pending')) { tok.classList.add('bump'); setTimeout(() => tok.classList.remove('bump'), 140); }
    const a = appRect(), f = fromEl.getBoundingClientRect(), t = tok.getBoundingClientRect();
    const g = document.createElement('div'); g.className = 'fly'; layer.append(g);
    const sx = f.left - a.left + f.width - 26, sy = f.top - a.top + f.height / 2;
    const ex = t.left - a.left + t.width / 2, ey = t.top - a.top + t.height / 2 - (restH - trayV);
    let x = sx, y = sy, k = 2;
    const paint = () => g.style.transform = `translate3d(${x - 11}px,${y - 11}px,0)`;
    paint();
    const fin = () => { if (--k) return; g.remove(); tok.classList.remove('pending'); landTray(500); };
    spring({from: sx, to: ex, v: (ex - sx) * .6, response: .5, damping: 1, onUpdate: v => { x = v; paint(); }, onDone: fin});
    spring({from: sy, to: ey, v: -Math.max(500, (ey - sy) * .9), response: .5, damping: .92, onUpdate: v => { y = v; paint(); }, onDone: fin});
  }
}
function sbPx() { const t = document.createElement('div'); t.style.cssText = 'position:absolute;height:var(--sb)'; app.append(t); const h = t.offsetHeight; t.remove(); return h; }
tc.addEventListener('click', e => {
  if (e.target.closest('#tlog')) return logTray();
  if (e.target.closest('#undo')) return undoLog();
  if (e.target.closest('#tsearch')) { openTray(true); setTimeout(() => tx.querySelector('input')?.focus(), RM ? 0 : 320); }
});

/* expanded tray */
let query = '';
function renderTx() {
  const items = trayItems(), sum = sumOf(items), today = sumOf(S.log);
  const hallMeal = it => it.hall === 'custom' ? 'Custom food' : `${it.hall}, ${MEAL_NAME[it.meal].toLowerCase()}`;
  let list;
  if (query) {
    const ql = query.toLowerCase(), res = [];
    HALLS.forEach(h => (DATA[h][S.meal] || []).forEach(([st, ds], si) => ds.forEach((d, di) => { if (d[0].toLowerCase().includes(ql)) res.push({key: `${h}|${S.meal}|${si}|${di}`, d, h}); })));
    list = res.length
      ? `<div class="grp">${res.slice(0, 30).map(r => `<div class="row" data-add="${esc(r.key)}" role="button" tabindex="0"><div class="rt"><div class="nm">${esc(r.d[0])}</div><div class="mc">${r.h}, ${fmtCal(r.d[1])} cal</div></div><span class="add" style="position:static"><i>${svg.plus}</i></span></div>`).join('')}</div>`
      : `<div class="grp"><div class="empty">No dishes match “${esc(query)}” at ${MEAL_NAME[S.meal].toLowerCase()}.</div><div class="cust"><input id="ccal" inputmode="numeric" placeholder="Calories" aria-label="Calories"><button class="pill" id="cadd" style="background:var(--tint);color:#fff">Add as custom food</button></div></div>`;
  } else if (items.length) {
    list = `<div class="grp">${items.map(it => `<div class="ti"><div class="row"><div class="rt"><div class="nm">${esc(it.d[0])}</div><div class="mc">${hallMeal(it)}, ${fmtCal(it.d[1] * it.q)} cal</div></div><span class="stp"><button data-dec="${esc(it.key)}" aria-label="Less">${svg.minus}</button><b>${fmtQ(it.q)}</b><button data-inc="${esc(it.key)}" aria-label="More">${svg.plus16}</button></span></div></div>`).join('')}</div>`;
  } else list = `<div class="grp"><div class="empty">Your tray is empty.</div></div>`;
  const keepFocus = document.activeElement && document.activeElement.id === 'q';
  const caret = keepFocus ? document.activeElement.selectionStart : 0;
  tx.innerHTML = `<div class="xh"><h2>${query ? 'Add something else' : 'Your tray'}</h2><p>${items.length ? `${fmtQ(sum.n)} ${sum.n === 1 ? 'item' : 'items'}, ${fmtCal(sum.cal)} cal` : `Today ${fmtCal(today.cal)} cal`}</p></div>
<div class="tlist">${list}</div>
<label class="srch">${svg.search}<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Add something else" value="${esc(query)}"></label>
<div class="xt"><div>Calories<b>${fmtCal(sum.cal)}</b></div><div>Protein<b>${fmtN(sum.p)} g</b></div><div>Carbs<b>${fmtN(sum.c)} g</b></div><div>Fat<b>${fmtN(sum.f)} g</b></div></div>
<div class="xd">Today after logging: ${fmtCal(today.cal + sum.cal)} cal, ${fmtN(today.p + sum.p)} g protein</div>
<button class="logbig" id="xlog" ${items.length ? '' : 'disabled'}>${items.length ? `Log ${fmtQ(sum.n)} ${sum.n === 1 ? 'item' : 'items'}` : 'Log'}</button>`;
  tx.style.height = 'auto';
  EXP = Math.min(trayMax(), tx.scrollHeight);
  tx.style.height = EXP + 'px';
  if (trayOpen && !G.lock && Math.abs(trayV - EXP) > 1) trayTo(EXP);
  if (keepFocus) { const q = tx.querySelector('#q'); q.focus(); q.setSelectionRange(caret, caret); }
  const p = clamp((trayV - restH) / (trayExp() - restH), 0, 1);
  tx.querySelectorAll('.ti').forEach((el, i) => el.style.transform = `translate3d(0,${(1 - p) * 26 * (i + 1)}px,0)`);
}
tx.addEventListener('input', e => { if (e.target.id === 'q') { query = e.target.value.trim(); renderTx(); } });
tx.addEventListener('click', e => {
  const dec = e.target.closest('[data-dec]'), inc = e.target.closest('[data-inc]'), add = e.target.closest('[data-add]');
  if (dec) { const it = S.tray.get(dec.dataset.dec); const n = it.q > 1 ? -1 : it.q === 1 ? -.5 : -.5; addKey(dec.dataset.dec, n, null, {half: true}); }
  else if (inc) { const it = S.tray.get(inc.dataset.inc); addKey(inc.dataset.inc, it.q < 1 ? .5 : 1); }
  else if (add) { query = ''; addKey(add.dataset.add, 1); }
  else if (e.target.closest('#cadd')) {
    const cal = +(tx.querySelector('#ccal').value || 0), name = query;
    query = ''; addKey('custom|' + name, 1, null, {d: [name, cal, 0, 0, 0, '', '1 serving']});
    S.tray.get('custom|' + name).hall = 'custom'; renderTx(); renderTray();
  }
  else if (e.target.closest('#xlog')) logTray();
});

/* log */
let logTimer;
function logTray() {
  const items = trayItems(); if (!items.length) return;
  const before = sumOf(S.log).cal;
  buzz([12, 50, 24]);
  const entries = items.map(it => ({...it, at: '12:40 PM'}));
  // plates slide off the tray
  const els = [...tc.querySelectorAll('.tok'), ...tx.querySelectorAll('.ti')];
  els.forEach((el, i) => { el.style.transitionDelay = (RM ? 0 : i * 35) + 'ms'; el.classList.add('gone'); });
  setTimeout(() => {
    S.log.push(...entries);
    S.logged = {n: sumOf(entries).n, before, after: sumOf(S.log).cal, entries};
    S.tray.clear(); query = '';
    entries.forEach(e => syncRow(e.key));
    trayOpen = false;
    renderTray();
    trayTo(restH, 0, .5, .8);
    roll(before, S.logged.after);
    renderToday();
    clearTimeout(logTimer);
    logTimer = setTimeout(() => { if (S.logged) { S.logged = null; renderTray(); } }, 6000);
  }, RM ? 0 : 180 + els.length * 35);
}
function roll(a, b) {
  const el = () => document.getElementById('roll'); const t0 = performance.now(), dur = RM ? 0 : 900;
  const step = now => { const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3); if (el()) el().textContent = fmtCal(a + (b - a) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function undoLog() {
  const L = S.logged; if (!L) return;
  S.log.splice(S.log.length - L.entries.length, L.entries.length);
  L.entries.forEach(e => { S.tray.set(e.key, {...e}); syncRow(e.key); });
  S.logged = null; clearTimeout(logTimer); buzz(10); renderTray(); renderToday();
}

/* ---------- Today page ---------- */
const PAIRS = [['Golden BBQ Chicken Thigh', 'Worcester', 'Black Bean Burger', 'Worcester'], ['Beef Brisket Noodle Bowl', 'Worcester', 'Mee Goreng', 'Worcester'], ['Make Your Own Waffles', 'Worcester', 'Hard Boiled Egg', 'Worcester']];
let pairI = 0;
function renderToday() {
  const t = sumOf(S.log), el = pageEls[0];
  const byMeal = {}; S.log.forEach(e => (byMeal[e.meal] = byMeal[e.meal] || []).push(e));
  const pair = PAIRS[pairI];
  el.innerHTML = `<p class="date">Thursday, October 8</p>
<div class="grp tot" style="margin-top:12px"><div class="li"><span>Calories</span><span>${fmtCal(t.cal)}</span></div><div class="li"><span>Protein</span><span>${fmtN(t.p)} g</span></div><div class="li"><span>Carbs</span><span>${fmtN(t.c)} g</span></div><div class="li"><span>Fat</span><span>${fmtN(t.f)} g</span></div></div>
${MEALS.filter(m => byMeal[m]).map(m => `<h3>${MEAL_NAME[m]}</h3><div class="grp">${byMeal[m].map(e => `<div class="li"><span>${esc(e.d[0])}${e.q !== 1 ? ' ×' + fmtQ(e.q) : ''}<small>${e.hall === 'custom' ? 'Custom food' : e.hall}, ${e.at}</small></span><span>${fmtCal(e.d[1] * e.q)} cal</span></div>`).join('')}</div>`).join('')}
<h3>Which was better?</h3>
${pair ? `<div class="h2h"><button data-pick>${esc(pair[0])}<small>${pair[1]}</small></button><button data-pick>${esc(pair[2])}<small>${pair[3]}</small></button></div>` : `<div class="grp"><div class="li"><span>Your halls</span><span>Worcester, Hampshire, Franklin, Berkshire</span></div></div>`}
<h3>Your data</h3>
<div class="grp"><button class="li tap" data-exp="csv">Export log as CSV</button><button class="li tap" data-exp="json">Export log as JSON</button></div>
<div style="height:${RAIL + 140}px"></div>`;
}
pageEls[0].addEventListener('click', e => {
  if (e.target.closest('[data-pick]')) { buzz(10); pairI++; renderToday(); return; }
  const x = e.target.closest('[data-exp]'); if (!x) return;
  const rows = S.log.map(e => ({date: '2026-10-08', time: e.at, hall: e.hall, meal: e.meal, dish: e.d[0], servings: e.q, cal: r1(e.d[1] * e.q), protein_g: r1(e.d[2] * e.q), carbs_g: r1(e.d[3] * e.q), fat_g: r1(e.d[4] * e.q)}));
  const body = x.dataset.exp === 'json' ? JSON.stringify(rows, null, 2) : [Object.keys(rows[0]).join(','), ...rows.map(r => Object.values(r).map(v => /[",]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type: 'text/plain'})); a.download = 'udine-log-2026-10-08.' + x.dataset.exp; a.click();
});
function renderCafes() {
  pageEls[5].innerHTML = `<h3 style="margin-top:4px">Cafés</h3><div class="grp">
<div class="li"><span>Blue Wall<small>Campus Center</small></span><span>Open until 8 PM</span></div>
<div class="li"><span>Harvest Market<small>Worcester Commons</small></span><span>Open now</span></div>
<div class="li"><span>People's Organic Coffee<small>Franklin Patio</small></span><span>Open until 4 PM</span></div>
<div class="li"><span>Grab 'N Go<small>Worcester, Franklin, Hampshire, Berkshire</small></span><span>Until 7 PM</span></div></div>
<h3>Events</h3><div class="grp"><div class="empty">No events posted this week.</div></div>
<h3>Newsletter</h3><div class="grp"><div class="empty">The October issue isn't out yet.</div></div><div style="height:${RAIL + 140}px"></div>`;
}

/* ---------- filters ---------- */
const fmenu = $('#fmenu'), fbtn = $('#fbtn');
const FOPTS = [['P', 'Plant based'], ['V', 'Vegetarian'], ['H', 'Halal'], ['G', 'No gluten'], ['F', 'Favorites']];
function renderFilters() {
  fmenu.innerHTML = FOPTS.map(([k, n]) => `<button role="menuitemcheckbox" aria-checked="${S.filters.has(k)}" class="${S.filters.has(k) ? 'on' : ''}" data-f="${k}">${n}${svg.check}</button>`).join('');
  fbtn.classList.toggle('on', S.filters.size > 0);
}
fbtn.addEventListener('click', e => { e.stopPropagation(); fmenu.classList.toggle('show'); buzz(6); });
fmenu.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-f]'); if (!b) return; const k = b.dataset.f; S.filters.has(k) ? S.filters.delete(k) : S.filters.add(k); buzz(6); renderFilters(); renderAllHalls(); });
app.addEventListener('pointerdown', e => { if (fmenu.classList.contains('show') && !e.target.closest('#fmenu,#fbtn')) fmenu.classList.remove('show'); });
[fbtn].forEach(b => b.addEventListener('pointerdown', () => b.classList.add('pr')));
addEventListener('pointerup', () => document.querySelectorAll('.glass.pr').forEach(b => b.classList.remove('pr')));
addEventListener('pointercancel', () => document.querySelectorAll('.glass.pr').forEach(b => b.classList.remove('pr')));

/* ---------- boot ---------- */
function boot() {
  measure(); renderFilters(); renderCafes(); renderToday();
  renderAllHalls();
  setPos(1); renderRuler();
  renderTray();
  setTray(restH);
  bindRail();
  const st = new URLSearchParams(location.search).get('state');
  if (st) applyState(st);
}
function applyState(st) {
  const k = name => { for (const h of ['Worcester']) { const sts = DATA[h].lunch; for (let si = 0; si < sts.length; si++) for (let di = 0; di < sts[si][1].length; di++) if (sts[si][1][di][0] === name) return `${h}|lunch|${si}|${di}`; } };
  const fill = () => { const g = k('Golden BBQ Chicken Thigh'), b = k('Beef Brisket Noodle Bowl');
    S.tray.set(g, {key: g, d: dishAt(g), hall: 'Worcester', meal: 'lunch', q: 2}); S.tray.set(b, {key: b, d: dishAt(b), hall: 'Worcester', meal: 'lunch', q: 1});
    syncRow(g); syncRow(b); renderTray(); tSpring && tSpring.stop(); setTray(restH);
    const sec = [...pageEls[1].querySelectorAll('.st h2')].find(h => h.textContent === 'Noodle Bowl'); pageEls[1].scrollTop = sec.parentElement.offsetTop - 6; };
  if (st === 'filled') fill();
  if (st === 'open') { fill(); trayOpen = true; renderTx(); setTray(trayExp()); }
  if (st === 'logged') { fill(); S.log.push(...trayItems().map(it => ({...it, at: '12:40 PM'}))); const after = sumOf(S.log).cal; S.logged = {n: 3, before: after, after, entries: trayItems()}; S.tray.clear(); renderAllHalls(); renderTray(); setTray(restH); renderToday(); }
  if (st === 'today') { applyState('logged'); setPos(0); }
  if (st === 'dinner') { setT(snapsFor('Worcester')[2]); }
  if (st === 'late-franklin') { setT(snapsFor('Worcester')[3]); setTimeout(() => setPos(2), 200); }
  if (st === 'search') { fill(); trayOpen = true; query = 'chicken'; renderTx(); setTray(trayExp()); }
  if (st === 'lift') {
    fill();
    const row = pageEls[1].querySelector(`.row[data-k="${CSS.escape(k('Hard Boiled Egg'))}"]`);
    const r = row.getBoundingClientRect();
    lift(row, r.left + 100, r.top + 30, 99);
    const ev = new PointerEvent('pointermove', {pointerId: 99, clientX: r.left + 140, clientY: appRect().top + H - 130});
    dispatchEvent(ev);
  }
  if (st === 'filter') { S.filters.add('P'); renderFilters(); renderAllHalls(); fmenu.classList.add('show'); }
}
addEventListener('resize', () => { measure(); setPos(pos); renderRuler(); renderAllHalls(); renderTray(); setTray(trayOpen ? trayExp() : restH); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { titleW = []; placeTitles(pos); bindRail(); });
boot();
</script>
