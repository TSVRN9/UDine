<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#3b0a0f">
<title>UDine M2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dm:#3b0a0f; --vm:#881c1c; --gold:#c99a2e; --chalk:#f8f9fb; --ink:#24171a; --slate:#6e6266;
  --tint:#f3e4e4; --hair:rgba(36,23,26,.12); --field:#eceef2;
  --st:24px; --sb:10px;
  /* motion tokens (mirrored in JS as MO; CONCEPT.md is the spec for mobile/src/lib/motion.ts) */
  --d-press:90ms;   --e-press:cubic-bezier(.2,0,0,1);
  --d-settle:200ms; --e-settle:cubic-bezier(.2,0,0,1);
  --d-cont:500ms;   --e-emph:cubic-bezier(.2,0,0,1);   /* --e-emph is replaced at boot by the M3 emphasized path (EMPH_CSS) */
  --d-exit:160ms;   --e-exit:cubic-bezier(.4,0,1,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a0b0f}
body{font-family:"Libre Franklin",system-ui,sans-serif;color:var(--ink);font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,.band:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.num,.o{font-family:Oswald,sans-serif;font-variant-numeric:tabular-nums}
#frame{position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;background:var(--chalk);top:50%;transform:translateY(-50%);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
@media (max-width:500px){
  #frame{width:100vw;height:100dvh;border-radius:0;top:0;transform:none;box-shadow:none}
  :root{--st:max(24px,env(safe-area-inset-top));--sb:max(10px,env(safe-area-inset-bottom))}
}
#probe{position:absolute;visibility:hidden;height:var(--st);width:var(--sb)}
.hide{display:none!important}
.tab{position:absolute;inset:0}
#halls,#search,#you{background:var(--chalk)}   /* every pane is opaque: a crossfade never shows what's under it */
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.pad-b{height:calc(150px + var(--sb))}

/* press feedback (token press in, release out): scale for compact controls, tint for full-width rows/bands */
/* press: finger down within 90 ms; release settles back, no overshoot anywhere */
.btn,.gbtn,.obtn,.custom,.chip,.hchip,.add,.step button,.icon,.tbar button,#mtabs button,.ptabs button,.vs button,.tbtn,.check i{transition:transform var(--d-settle) var(--e-settle),background-color var(--d-settle) var(--e-settle),color var(--d-settle) var(--e-settle),box-shadow var(--d-settle) var(--e-settle)}
.btn.down,.gbtn.down,.hchip.down,.obtn.down,.custom.down,.chip.down,.add.down,.step button.down,.icon.down,.tbar button.down,#mtabs button.down,.ptabs button.down,.vs button.down,.tbtn.down{transform:scale(.97);transition-duration:var(--d-press);transition-timing-function:var(--e-press)}
.row,.lrow,.prow2,#stidx button,.check,.prow,.evcard,.swbtn,.pin{transition:background-color var(--d-settle) var(--e-settle)}
.row.down,.lrow.down,.prow2.down,.check.down{background:rgba(36,23,26,.06);transition-duration:var(--d-press)}
#stidx button.down{background:rgba(36,23,26,.06);transition-duration:var(--d-press)}
.evcard.down,.swbtn.down,.pin.down{background:rgba(255,255,255,.08);transition-duration:var(--d-press)}
.band.down .press{opacity:1;transition-duration:var(--d-press)}
.fadein{animation:fadeIn var(--d-settle) var(--e-settle) both}
@keyframes fadeIn{from{opacity:0}}
/* ghosts: the outgoing content of a container transform */
.trav{position:absolute;z-index:45;pointer-events:none;margin:0;overflow:hidden}
.pdim{position:absolute;inset:0;background:rgb(36,10,14);opacity:0;pointer-events:none}

/* ---------- tab bar ---------- */
.tbar{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--hair);display:flex;padding-bottom:var(--sb)}
.tbar button{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--slate);position:relative}
.tbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbar button[aria-selected=true]{color:var(--vm)}
.tbar .ind{position:absolute;top:-1px;left:0;height:3px;width:calc(100% / 3);background:var(--vm);transition:transform var(--d-settle) var(--e-settle);pointer-events:none}

/* ---------- plate bar ---------- */
#bar{position:absolute;left:0;right:0;z-index:39;bottom:calc(57px + var(--sb));background:var(--dm);color:#fff;transform:translateY(110%);transition:transform var(--d-cont) var(--e-emph);touch-action:none}
#bar.on{transform:none}
#frame #bar.insheet,#frame.kb #bar.insheet{position:relative;bottom:auto;transform:none;transition:none;flex:none;z-index:auto}
#frame.kb .tbar{display:none}
#frame.kb #bar{bottom:var(--kb)}
#bar .in{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 12px 8px 20px}
#bar .txt{flex:1;min-width:0}
#bar .l1{font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .l2{font-size:13px;color:rgba(255,255,255,.8);margin-top:2px;white-space:nowrap}
#bar .l2 b{font:600 26px/1 Oswald,sans-serif;color:#fff;font-variant-numeric:tabular-nums;margin-right:2px}
#bar .l2 b+span{margin-right:12px}
#bar .acts{display:flex;gap:8px}
.gbtn{height:48px;min-width:84px;padding:0 18px;border-radius:8px;background:var(--gold);color:var(--dm);font-weight:700;font-size:16px}
.obtn{height:44px;padding:0 14px;border-radius:8px;border:1.5px solid rgba(255,255,255,.7);color:#fff;font-weight:600;font-size:15px}
#bar .dots{position:absolute;left:0;right:0;top:5px;display:flex;justify-content:center;gap:5px}
#bar .dots i{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
#bar .dots i.on{background:var(--gold)}
#bar .peek{position:absolute;left:10px;right:10px;top:-5px;height:5px;background:#5a1820;border-radius:3px 3px 0 0}
.roll{display:inline-block;position:relative;overflow:hidden;vertical-align:bottom}
.roll>span{display:inline-block}

/* ---------- halls ---------- */
.hhead{background:var(--dm);color:#fff;padding:calc(var(--st) + 10px) 20px 16px}
.hhead .r1{display:flex;justify-content:space-between;align-items:baseline;height:30px}
.brand{font:600 22px Oswald,sans-serif;color:var(--gold)}
.hhead .date{font-size:15px;color:rgba(255,255,255,.8)}
.hhead h1{font:600 52px/1.05 Oswald,sans-serif;margin:2px 0 0}
#mdim{position:absolute;inset:0;background:rgb(36,10,14);opacity:0;pointer-events:none}
/* events: a fixture list. One row type, on the maroon band in Search and on chalk inside a hall menu */
/* events (round 4: cards again): the event's own banner in a felt edge and gold stitching, title and date under it.
   A row of cards with native scroll-snap and a peek of the next one, on the maroon band. */
.sdisc{background:var(--dm);padding:4px 0 16px;overflow:hidden}
.sdisc h2{font:600 22px/1.2 Oswald,sans-serif;color:#fff;margin:0;padding:10px 20px 0}
.evc{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;padding:12px 0 4px 20px;margin:0;scrollbar-width:none;overscroll-behavior-x:contain}
.evc::-webkit-scrollbar{display:none}
.evc::after{content:"";flex:0 0 8px}   /* the end gutter is the 12px gap + this 8px spacer = 20, matching the start (no end padding: WebKit drops it in flex scrollers) */
.evc.one::after{display:none}
.evc .evcard{flex:0 0 280px;scroll-snap-align:start;display:block;text-align:left;color:#fff}
.evc.one .evcard{flex-basis:calc(100% - 20px)}
.evcap{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.evtt{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.92)}
.evtag{flex:none;color:var(--gold);font:600 15px/1.3 Oswald,sans-serif;font-variant-numeric:tabular-nums}
.evcard.down .evpatch{opacity:.85}
/* the in-menu note is still a quiet row on chalk */
.evrow{display:flex;align-items:baseline;gap:12px;width:100%;min-height:52px;padding:14px 20px;text-align:left;position:relative}
.evrow .evtt{white-space:normal;color:var(--dm)}
.evnote{color:var(--dm);border-bottom:1px solid var(--hair)}
.evnote .evtag{color:var(--vm);font-size:16px}
.evnote.down{background:rgba(36,23,26,.06)}
/* event page: the flyer, framed as a stitched patch on the maroon band */
.evband{background:var(--dm);margin:0 -20px;padding:14px 20px 20px}
.evpatch{position:relative;display:block;aspect-ratio:1024/432;border-radius:6px;overflow:hidden;background:var(--vm);box-shadow:0 0 0 3px #fff}
.evpatch img{display:block;width:100%;height:100%;object-fit:cover}
.evpatch::after{content:"";position:absolute;inset:4px;border-radius:3px;border:1.5px dashed rgba(201,154,46,.95);pointer-events:none}
.field svg{width:20px;height:20px;stroke:var(--vm);fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.band{display:block;position:relative;width:100%;height:112px;overflow:hidden;background:var(--vm);margin-top:1px;text-align:left;color:#fff;touch-action:manipulation}
#bands{background:var(--dm);display:flow-root}   /* flow-root: the first band's 1px top margin stays a maroon seam instead of collapsing out onto the chalk */
.win{position:absolute;left:0;right:0;top:0;height:var(--hh)}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.ph-W{background-image:url(__IMG_W__);background-position:72% 0}
.ph-F{background-image:url(__IMG_F__);background-position:42% 0}
.ph-H{background-image:url(__IMG_H__);background-position:60% 0}
.ph-S{background-image:url(__IMG_S__);background-position:30% 40%}
.ph-B{background-image:url(__IMG_B__);background-position:62% 0}
.duo{position:absolute;inset:0;isolation:isolate}
.duo .g{filter:grayscale(1) contrast(1.12)}
.duo .t{position:absolute;inset:0;background:#c4434b;mix-blend-mode:multiply}
.duo .s{position:absolute;inset:0;background:var(--dm);mix-blend-mode:screen}
.lgrad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(59,10,15,.82) 0,rgba(59,10,15,.55) 45%,rgba(59,10,15,0) 75%)}
.press{position:absolute;inset:0;background:rgba(59,10,15,.22);opacity:0;transition:opacity var(--d-settle) var(--e-settle)}
.let{position:absolute;right:0;width:200px;height:200px;pointer-events:none;overflow:visible}
.band .let{top:-6px}
.let .felt{fill:#fff;stroke:#fff;stroke-width:12px;stroke-linejoin:round}
.let .gold{fill:var(--gold);stroke:var(--dm);stroke-width:1.5px;stroke-dasharray:5 4}
.let text{font:700 210px Oswald,sans-serif}
.bt{position:absolute;left:20px;top:16px}
.bt .nm,.mt .nm{font:600 32px/1 Oswald,sans-serif;transform-origin:0 100%}
.bt .st,.mt .st{font-size:15px;margin-top:7px;color:rgba(255,255,255,.86)}
.sec{padding:22px 20px 0}
.sec h2{font:600 22px/1.2 Oswald,sans-serif;color:var(--dm);margin:0 0 4px}
.lrow{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid var(--hair);width:100%;text-align:left;padding:8px 0;gap:12px}
.lrow:last-child{border-bottom:0}
.lrow .a{font-weight:600}
.lrow .b{font-size:13px;color:var(--slate);margin-top:2px}
.lrow .r{font-size:15px;color:var(--vm);font-weight:500;white-space:nowrap}

/* ---------- hall menu ---------- */
#menu{position:absolute;inset:0;z-index:5}
/* container transform: the opaque container surface, and the source's content drawn inside it while it fades out */
#mcont{position:absolute;inset:0;background:var(--chalk)}
#mghost{position:absolute;left:0;right:0;top:0;pointer-events:none;z-index:4}
#mghost.gband{overflow:hidden;background:var(--vm);color:#fff;text-align:left}
#mghost.gband .let{top:-6px}
#mghost.rowsrc{background:var(--chalk);overflow:hidden}
#mghost.rowsrc>*{width:100%}
.row.here{background:rgba(136,28,28,.07)}
.tday{color:rgba(255,255,255,.9);font-size:.62em}
/* pinned cafés (round 5): the hall band at three-quarter scale, in the same rack. 84 px (band 112), Oswald 24 (32), the same
   20 px inset and top-anchored text, the same deep-maroon left gradient and 1 px maroon seam. The café's own photo stays in
   full colour (only halls get the duotone and a chenille letter). */
#pins:empty{display:none}
.pcard{position:relative;display:block;width:100%;height:84px;margin-top:1px;overflow:hidden;background:var(--dm);text-align:left;color:#fff}
.pcard img,.thumb img,.phero img{display:block;width:100%;height:100%;object-fit:cover}
.pcard img{object-position:50% 45%}
.pcard .pg{position:absolute;inset:0;background:linear-gradient(90deg,rgba(59,10,15,.86) 0,rgba(59,10,15,.76) 50%,rgba(59,10,15,.3) 76%,rgba(59,10,15,0) 92%)}
.pcard .pt{position:absolute;left:20px;right:30%;top:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.pcard .pn,.pcard .ps{max-width:100%}
.pcard .pn{font:600 24px/1 Oswald,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .ps{font-size:14px;line-height:1.2;color:#fff}
.pcard .press{border-radius:0}
.pcard.down .press{opacity:1;transition-duration:var(--d-press)}
#pins{background:var(--dm);display:flow-root}
.thumb{flex:none;width:64px;height:34px;border-radius:5px;overflow:hidden;background:var(--hair)}
.lrow .lt{display:flex;align-items:center;gap:12px;min-width:0}
.prow2 .lt{display:flex;align-items:center;gap:12px;min-width:0}
.phero{margin:0 -20px;aspect-ratio:640/341;background:var(--dm)}
.pbar .pinb{margin-left:auto}
.pinb svg{fill:none}
.pinb[aria-pressed=true] svg{fill:var(--gold);stroke:var(--gold)}
/* where and when a dish is served (Search rows), and its servings (detail) */
.row .tags .ht{width:18px;height:18px;font-size:12px}
/* where (round 5): a meal and a clock time, then the halls serving it as felt-letter tags on deep maroon (the band's pairing at button size) */
.where{margin-top:18px}
.wl+.wl{margin-top:14px}
.wt{font:600 20px/1.2 Oswald,sans-serif;color:var(--dm);margin:0 0 8px}
.wl.more .wt{font:600 17px/1.2 Oswald,sans-serif;color:var(--vm)}
.wc{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 8px;border-radius:8px;background:var(--dm);color:#fff;font:600 18px/1 Oswald,sans-serif}
.hchip .hl{position:relative;display:grid;place-items:center;width:28px;height:28px;border-radius:4px;background:var(--gold);color:var(--dm);font:700 18px/1 Oswald,sans-serif;font-style:normal}
.hchip .hl::after{content:"";position:absolute;inset:2px;border-radius:2px;border:1px dashed rgba(59,10,15,.75)}
.lnext{font-size:13px;color:var(--slate);margin-right:2px}
#mscroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior-y:contain}
#mspace{height:calc(var(--hh) + 96px)}
#mlist{background:var(--chalk);min-height:100%}
#mhead{position:absolute;left:0;right:0;top:0;height:var(--hh);overflow:hidden;z-index:2;background:var(--vm);will-change:transform;pointer-events:none}
#mhead .phw{position:absolute;inset:0;will-change:transform}
.tgrad{position:absolute;left:0;right:0;top:0;height:calc(var(--st) + 80px);background:linear-gradient(rgba(59,10,15,.6),rgba(59,10,15,0))}
.bgrad{position:absolute;left:0;right:0;bottom:0;height:240px;background:linear-gradient(rgba(59,10,15,0),rgba(59,10,15,.5) 30%,rgba(59,10,15,.74) 50%,rgba(59,10,15,.93) 76%)}
#msolid{position:absolute;inset:0;background:var(--vm);opacity:0}

#mhead .let{top:calc(var(--st) + 26px)}
.mt{position:absolute;left:20px;bottom:50px;color:#fff}
.mt .nm{font-size:40px;display:block}
#mctl{position:absolute;left:0;right:0;top:0;height:calc(var(--st) + 52px);padding-top:var(--st);z-index:4;display:flex;justify-content:space-between;align-items:center;padding-left:4px;padding-right:4px;pointer-events:none}
#mctl button{pointer-events:auto}
.icon{width:48px;height:48px;display:grid;place-items:center;color:#fff}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#mtabs{position:absolute;left:0;right:0;top:var(--hh);height:48px;z-index:3;background:var(--dm);display:flex;padding:0 6px;will-change:transform}
#mtabs button{flex:1 1 auto;height:48px;color:rgba(255,255,255,.8);font-size:15px;font-weight:500;white-space:nowrap;position:relative;padding:0 6px}
#mtabs button[aria-selected=true]{color:#fff;font-weight:600}
#mtabs .ul{position:absolute;left:0;bottom:0;height:3px;width:1px;background:var(--gold);transform-origin:0 0;transition:transform var(--d-settle) var(--e-settle);pointer-events:none}
.sth{display:flex;align-items:flex-end;width:100%;height:50px;padding:0 20px 6px;margin:0;background:var(--chalk);font:600 22px Oswald,sans-serif;color:var(--dm);text-align:left}


/* station row: the last row of the header (photo -> name -> meals -> station); it grows down into the roster */
#mswitch{position:absolute;left:0;right:0;top:calc(var(--hh) + 48px);height:48px;z-index:3;background:var(--dm);border-top:1px solid rgba(255,255,255,.12);will-change:transform}
.swbtn{display:flex;align-items:center;gap:8px;width:100%;height:47px;padding:0 20px;color:var(--gold);text-align:left}
.swbtn .o{font:600 20px/1 Oswald,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swbtn svg{width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--d-cont) var(--e-emph)}
.swbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.row{display:flex;align-items:center;min-height:64px;padding:6px 8px 6px 20px;gap:8px;position:relative}
.row::after{content:"";position:absolute;left:20px;right:0;bottom:0;height:1px;background:var(--hair)}
.row .tx{flex:1;min-width:0}
/* the control lane is always as wide as the stepper, so + -> stepper never re-wraps the name */
.row>.add{margin-left:66px}
.row .n{font-weight:600;line-height:1.25}
.row .m{font-size:13px;color:var(--slate);margin-top:3px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.row .m b{font:500 15px Oswald,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.row .m .gap{width:8px}
.star{color:var(--vm);font-size:13px;margin-left:4px}
.add{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;color:var(--vm);flex:none}
.add svg,.step svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.add.ghost{box-shadow:inset 0 0 0 1.5px rgba(136,28,28,.45);width:44px;height:44px;margin:2px}
.row>.add.ghost{margin-left:68px}
.step{display:flex;align-items:center;background:var(--tint);border-radius:8px;height:44px;flex:none}
.step button{width:44px;height:44px;display:grid;place-items:center;color:var(--vm)}
.step .q{min-width:26px;text-align:center;font:600 20px Oswald,sans-serif;color:var(--dm);font-variant-numeric:tabular-nums}
.ht{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:600 13px/1 Oswald,sans-serif;font-style:normal;color:var(--slate);box-shadow:inset 0 0 0 1px rgba(110,98,102,.45);margin-left:2px}
.ht.on{background:var(--dm);color:var(--gold);box-shadow:none}
/* embroidered patch: gold felt, maroon stitching, maroon glyph. Same family as the chenille hall letters */
.tg{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:var(--gold);color:var(--dm);margin-left:6px;vertical-align:-3px;position:relative}
.tg::after,.mk::after{content:"";position:absolute;inset:2px;border-radius:2px;border:1px dashed rgba(59,10,15,.75);pointer-events:none}
.tg .gl{width:12px;height:12px}
.nw{white-space:nowrap}
.tags{display:inline-flex;gap:2px;margin-left:6px}
/* station list: a standard bottom sheet (isheet) */
#stidx{margin:0 -20px}
#stidx button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:0 20px 0 16px;text-align:left;font-size:17px;font-weight:500;color:var(--ink);border-left:4px solid transparent}
#stidx button.cur{border-left-color:var(--vm);font-weight:700;color:var(--vm)}
#stidx button .c{font:500 16px Oswald,sans-serif;color:var(--slate)}

<script>
'use strict';
const M = __MENU__;
const MT = __MENU2__;                          // tomorrow, Friday Oct 9
const menuOf = day => day ? MT : M;            // every hall-menu read goes through this
const HALLS = ['W','F','H','B'];
const HN = {W:'Worcester',F:'Franklin',H:'Hampshire',B:'Berkshire'};
const P = __PLACES__;
const RIMG = __RIMG__;                         // UMass Dining's own location-card photos, by place name (and grab:W etc.)                         // real hours, payment, descriptions, menus (uapp/get_infov2), events (get_beacons_events)
const NOW = 12*60+40;                          // Thursday 12:40 PM
const fmtT = m => m>=1439?'midnight': m===720?'noon' : `${(Math.floor(m/60)+11)%12+1}${m%60?':'+String(m%60).padStart(2,'0'):''} ${m<720?'AM':'PM'}`;
const span = (o,c) => `${fmtT(o)} to ${fmtT(c)}`;
const isOpen = ([o,c]) => NOW>=o && NOW<c;
const status = ([o,c]) => NOW<o ? `Opens ${fmtT(o)}` : NOW>=c ? 'Closed for today' : `Open until ${fmtT(c)}`;
const HOURS = Object.fromEntries(Object.entries(P.hours).map(([h,v])=>[h,status(v)]));
// Busy: same shape as get_infov2's `busy`. Values are SIMULATED for a Thursday lunch rush (the live capture was from the evening).
const NULL3 = [{in:30,pct:null},{in:60,pct:null},{in:90,pct:null}];
const BUSY = {
  W:{level:2,label:'Busy',pct:82,usual_pct:86,trend:'falling',vs_usual:'usual',outlook:[{in:30,pct:70},{in:60,pct:55},{in:90,pct:40}],calmer_at:'13:30',confidence:'good'},
  F:{level:1,label:'A little busy',pct:48,usual_pct:55,trend:'falling',vs_usual:'usual',outlook:NULL3,calmer_at:null,confidence:'new'},
  H:{level:0,label:'Not busy',pct:27,usual_pct:44,trend:'steady',vs_usual:'quieter',outlook:NULL3,calmer_at:null,confidence:'good'},
  B:{level:2,label:'Busy',pct:88,usual_pct:74,trend:'steady',vs_usual:'busier',outlook:[{in:30,pct:80},{in:60,pct:68},{in:90,pct:null}],calmer_at:null,confidence:'new'},
};
// Typical Thursday, busy % by hour from opening (SIMULATED; would come from our own occupancy-history table)
const TYPICAL = {
  W:[7,[15,25,30,22,30,62,86,70,40,30,45,70,82,60,40,30,22]],
  F:[7,[12,20,22,18,30,55,50,30,20,25,45,55,35,20]],
  H:[7,[10,18,20,16,28,44,40,25,18,22,40,48,30,18]],
  B:[11,[45,74,70,45,30,40,72,84,70,50,40,45,38]],
};
function busyRow(h, full){
  const b=BUSY[h], n=Math.max(1,Math.ceil(b.pct/20)), low=b.confidence!=='good';   // low confidence is carried by the word, never by the meter
  const word = low ? 'Probably '+b.label.toLowerCase() : b.label;
  let extra='';
  if(full){ if(b.calmer_at){ const [hh,mm]=b.calmer_at.split(':').map(Number); extra=`Calmer around ${fmtT(hh*60+mm)}`; }
    else if(b.vs_usual==='busier') extra='Busier than usual'; else if(b.vs_usual==='quieter') extra='Quieter than usual'; }
  return `<span class="meter" aria-hidden="true">${[0,1,2,3,4].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</span><span>${word}</span>${full?`<span class="bzx">${extra}</span>`:''}`;
}
const lamps = pct => Math.max(1,Math.ceil(pct/20));   // one quantization for the band meter and the header board
function histSVG(h){
  // scoreboard lamp board: one column of five lamps per hour, lit like the band meter. Now is gold.

    if(!g.mode){ if(Math.hypot(dx,dy)<6) return; g.mode=Math.abs(dy)>Math.abs(dx)?'v':'h';
      if(g.mode==='v'){ if(!plateOpen()){ g=null; return; } activeSheet=psheet; g.top=PS.rest; }
      try{ bar.setPointerCapture(e.pointerId); }catch(_){} }
    g.vs.push([e.timeStamp,e.clientY,e.clientX]); if(g.vs.length>6) g.vs.shift();
    if(g.mode==='v') psheet.drag(g.top+dy);
    else bar.querySelector('.in').style.transform=`translateX(${S.plates.length>1?dx:dx*.25}px)`; });
  const end=e=>{ if(!g||e.pointerId!==g.id) return; const G=g; g=null; const vs=G.vs;
    if(!G.mode){ if(plateOpen()) psheet.to('mid'); return; }   // a tap: on pointerup, so a click swallowed after a fling can't lose it
    suppressClick=true; setTimeout(()=>suppressClick=false,50);
    const a=vs[0],b=vs[vs.length-1]; const dt=b&&a?(b[0]-a[0]):0;
    if(G.mode==='v'){ psheet.release(dt?clamp((b[1]-a[1])/dt*1000,-4000,4000):0); return; }
    const inn=bar.querySelector('.in'); const dx=e.clientX-G.x0, vx=dt?(b[2]-a[2])/dt:0;
    if(S.plates.length>1 && (Math.abs(dx)>70||Math.abs(vx)>.5)){ const dir=dx<0?1:-1; S.front=(S.front+dir+S.plates.length)%S.plates.length; buzz(5);
      inn.style.transform=''; inn.innerHTML=''; renderBar(); A(inn,[{transform:`translateX(${dir*60}px)`,opacity:0},{transform:'none',opacity:1}],'settle'); refreshLists(); }
    else { A(inn,[{transform:inn.style.transform||'none'},{transform:'none'}],'settle'); inn.style.transform=''; } };
  bar.addEventListener('pointerup',end);
  bar.addEventListener('pointercancel',e=>{g=null; bar.querySelector('.in').style.transform='';});
})();


function rowState(row){
  if(row.dataset.id){ const d=DISH[row.dataset.id], f=findItem(d.meal,d.k,d.h); return [f?f.it.qty:0, !f && wouldSplit(d.meal,[d.h])]; }
  const g=BYK[S.smeal][row.dataset.k], f=findItem(S.smeal,g.k); return [f?f.it.qty:0, !f && wouldSplit(S.smeal,Object.keys(g.refs))]; }
function setCtl(row, q, ghost){
  const st=row.querySelector('.step'), ad=row.querySelector(':scope > .add'), old=st?+st.dataset.q:0;
  if(q===old){ if(ad) ad.classList.toggle('ghost',!!ghost); return; }
  const make=h=>{ const t=document.createElement('div'); t.innerHTML=h; return t.firstElementChild; };
  if(old && q){ st.dataset.q=q; st.querySelector('.q').textContent=fq(q); return; }
  if(!old && q){ const n=make(ctl(q)); ad.replaceWith(n); n.style.transformOrigin='100% 50%';
    A(n,[{transform:'scaleX(.42)',opacity:0},{transform:'none',opacity:1}],'settle');   // + widens leftward into its lane
    return; }
  // removed: the stepper shrinks away (as a detached ghost) while + pops back
  const n=make(ctl(0,ghost)), gh=st.cloneNode(true), r=st.getBoundingClientRect(), rr=row.getBoundingClientRect();
  gh.style.cssText=`position:absolute;left:${r.left-rr.left}px;top:${r.top-rr.top}px;pointer-events:none;transform-origin:100% 50%`; row.appendChild(gh);
  st.replaceWith(n); done(A(gh,[{transform:'none',opacity:1},{transform:'scaleX(.4)',opacity:0}],'exit')).then(()=>gh.remove());
  A(n,[{opacity:0},{opacity:1}],'settle');
}
function refreshLists(){
  for(const box of [S.hall&&!S.mday&&$('#mlist'), $('#sres')]) if(box) for(const row of box.querySelectorAll('.row:not(.later)')){ const [q,g]=rowState(row); setCtl(row,q,g); }
}
function refreshSheet(){ if(psheet.state==='closed') return; const pl=S.plates[S.front], b=$('#psbody');
  if(!pl || b.dataset.pid!=String(pl.id) || +b.dataset.n!==pl.items.length){ renderPSheet(); return; }
  const hs=plateHalls(pl), t=totals(pl); $$('#psbody .prow').forEach((r,i)=>setCtl(r, pl.items[i].qty));
  const fb=$$('#psbody .facts b'); [fc(t.cal),f1(t.p)+'g',f1(t.c)+'g',f1(t.f)+'g'].forEach((v,i)=>{ if(fb[i]) fb[i].textContent=v; }); }
function refresh(){ refreshLists(); renderBar(); refreshSheet(); if(!S.plates.length && psheet.state!=='closed') psheet.to('closed'); }

/* ---------- input ---------- */
document.addEventListener('pointerdown',e=>{ const t=e.target.closest('button,.row,.lrow,.band'); if(!t) return; t.classList.add('down');
  const up=()=>{ t.classList.remove('down'); removeEventListener('pointerup',up,true); removeEventListener('pointercancel',up,true); };
  addEventListener('pointerup',up,true); addEventListener('pointercancel',up,true); }, true);
document.addEventListener('scroll',()=>$$('.down').forEach(x=>x.classList.remove('down')),true);

document.addEventListener('click',e=>{
  if(suppressClick){ e.preventDefault(); return; }
  const t=e.target;
  const tb=t.closest('.tbar button'); if(tb){ const k=tb.dataset.tab;
    if(k===S.tab && S.hall && S.hallTab===k){ closeHall(); return; }
    if(k==='search' && S.tab==='search'){ $('#q').focus(); return; } if(k==='search'){ goSearch(null,'lunch'); return; } setTab(k); return; }
  // a tap on the plate bar grows it into the plate sheet (handled on click, after the touch is over)
  const bb=t.closest('#bar'); if(bb && !t.closest('button')){ if(barMode==='plate' && plateOpen()) psheet.to('mid'); return; }
  const band=t.closest('.band'); if(band){ openHall(band.dataset.h); return; }
  const mt=t.closest('#mtabs button'); if(mt){ const ts=$$('#mtabs button'), dir=Math.sign(ts.indexOf(mt)-ts.findIndex(b=>b.getAttribute('aria-selected')==='true'));
    if(!dir) return; S.mmeal=mt.dataset.meal; ts.forEach(b=>b.setAttribute('aria-selected',b===mt)); placeUL(true);
    sharedAxisX(dir, renderMenuList); const R=HH-CH; if($('#mscroll').scrollTop>R) $('#mscroll').scrollTop=R; if(!S.mday) syncFront(S.hall); buzz(4); return; }
  const jb=t.closest('[data-jump]'); if(jb){ jump(jb.dataset.jump); return; }
  const lens=t.closest('[data-lens]'); if(lens){ const k=lens.dataset.lens; S.lenses.has(k)?S.lenses.delete(k):S.lenses.add(k); buzz(4); lens.setAttribute('aria-pressed',S.lenses.has(k)); renderSearch(); return; }
  const pt=t.closest('[data-plate]'); if(pt){ S.front=+pt.dataset.plate; renderPSheet(); A($('#psbody > div'),[{opacity:.3},{opacity:1}],'settle'); renderBar(); refreshLists(); buzz(4); return; }
  const dk=t.closest('[data-diet]'); if(dk){ S.diet[dk.dataset.diet]=!S.diet[dk.dataset.diet]; dk.setAttribute('aria-checked',S.diet[dk.dataset.diet]); buzz(4); save(); return; }
  const wn=t.closest('[data-win]'); if(wn){ S.wins[wn.dataset.key]=wn.dataset.win; buzz(6); rerenderPage(); return; }
  // rows: + tosses the dish's calories into the plate, − takes them back out, the row itself grows into its detail
  const row=t.closest('.row');
  if(row){
    let meal, k, refs, n, ctxHall=null, d=null;
    if(row.dataset.id){ d=DISH[row.dataset.id]; meal=d.meal; k=d.k; n=d.n; refs={[d.h]:d}; ctxHall=d.h; }
    else { meal=S.smeal; const g=BYK[meal][row.dataset.k]; k=g.k; n=g.n; refs=g.refs; d=rep(g); }
    if(t.closest('.add')){ addDish(meal,k,refs,n); afterPick(row); return; }
    const f=findItem(meal,k,ctxHall);
    if(t.closest('.inc')&&f){ stepItem(f.pl,f.it,1); afterPick(row); return; }
    if(t.closest('.dec')&&f){ stepItem(f.pl,f.it,-1); return; }
    if(!t.closest('button')) openDish(d, row);
    return;
  }
  const prow=t.closest('.prow'); if(prow){ const pl=S.plates[S.front], it=pl.items[+prow.dataset.pi]; if(t.closest('.inc')) stepItem(pl,it,1); else if(t.closest('.dec')){
    // the last half leaves the plate: its row closes up (nothing to travel to; the plate is where it was)
    if(it.qty===.5) done(A(prow,[{height:prow.offsetHeight+'px',opacity:1},{height:'0px',opacity:0}],'exit',{fill:'forwards'})).then(()=>stepItem(pl,it,-1)); else stepItem(pl,it,-1); } return; }
  const a=t.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='unscope'){ S.scope=null; S.smeal='lunch'; done(A(a,[{opacity:1,transform:'none'},{opacity:0,transform:'scale(.9)'}],'exit')).then(()=>{ renderLenses(); renderSearch(); }); }
  else if(act==='back') closeHall();
  else if(act==='closeidx') closeIdx();
  else if(act==='stations') (isheet.state!=='closed' && $('#isbody #stidx') ? closeIdx() : openIdx());
  else if(act==='srv'){ const d=DISH[a.dataset.id], src=isheet.src;
    // the detail returns to its row, then that same row grows into the hall at that day and meal (a hall-menu row can't host it: the band does)
    const from = src && src.isConnected && !src.closest('#menu') ? src : undefined;
    isheet.shrink(()=>openHall(d.h, false, from, {day:d.day, meal:d.meal, dish:d.id})); }
  else if(act==='pin'){ const n=a.dataset.name, on=S.pins.includes(n); S.pins = on ? S.pins.filter(x=>x!==n) : [...S.pins, n]; save(); renderPins();
    a.setAttribute('aria-pressed',!on); a.setAttribute('aria-label',on?'Pin to Halls':'Unpin from Halls'); buzz(on?4:8); }
  else if(act==='fulllabel') openPlateLabel(a);
  else if(act==='ing'){ const box=$('#ing'), open=a.getAttribute('aria-expanded')==='true', lh=parseFloat(getComputedStyle(box.firstElementChild).lineHeight)*3;
    box.style.transition=RM?'none':`max-height ${MO.settle.d}ms ${MO.settle.e}`; box.style.maxHeight=(open?lh:box.scrollHeight)+'px'; box.classList.toggle('open',!open);
    a.setAttribute('aria-expanded',!open); a.textContent=open?'Show all':'Show less'; buzz(3); }
  else if(act==='page') openPage(a.dataset.p, a.dataset.c, a);
  else if(act==='opennow'){ S.openNow=!S.openNow; buzz(4); rerenderPage(); }
  else if(act==='hall'){ $('#q').blur(); openHall(a.dataset.h, false, a, {meal:a.dataset.meal||'lunch'}); }   // the result row grows into the hall
  else if(act==='pageback') closePage();
  else if(act==='custom'){ openCustom(a.dataset.name!==undefined?a.dataset.name:S.q, a); }
  else if(act==='barlog'){ const pl=S.plates[S.front], hs=plateHalls(pl); if(hs&&hs.length>1){ barMode='choose'; renderBar(); } else logPlate(pl); }
  else if(act==='log') logPlate(S.plates[S.front]);
  else if(act==='logat') logPlate(S.plates[S.front], a.dataset.h);
  else if(act==='undo') undoLog();
  else if(act==='unchoose'){ barMode='plate'; $('#bar .in').innerHTML=''; renderBar(); }
  else if(act==='more'){ psheet.to('closed'); goSearch(null, S.plates[S.front]?.meal||'lunch'); }
  else if(act==='clear'){ S.plates.splice(S.front,1); S.front=0; psheet.to('closed'); refresh(); }
  else if(act==='dietoff'){ S.diet={veg:false,plant:false,halal:false}; save(); renderMenuList(); A($('#mlist'),[{opacity:.4},{opacity:1}],'settle'); }
  else if(act==='dadd'){ const d=DISH[a.dataset.id], g=BYK[d.meal][d.k], src=isheet.src;
    // the detail shrinks back into its row; the row's + becomes its stepper and the bar updates in place
    isheet.shrink(()=>addDish(d.meal,d.k, src&&src.dataset.k?g.refs:{[d.h]:d}, d.n)); }
  else if(act==='fav'){ const k=a.dataset.k; S.fav.has(k)?S.fav.delete(k):S.fav.add(k); save(); a.textContent=S.fav.has(k)?'★ Favorited':'☆ Add to favorites'; buzz(6);
    const sid=isheet.src&&(isheet.src.dataset.id||isheet.src.dataset.k);
    if(S.tab==='halls'&&S.hall){ const y=$('#mscroll').scrollTop; renderMenuList(); $('#mscroll').scrollTop=y; } else if(S.tab==='search') renderSearch();
    // the list re-rendered under the sheet: the sheet now belongs to the new row (hidden, as its source was)
    const nr=sid&&$$('.row').find(r=>(r.dataset.id||r.dataset.k)===sid); if(nr){ nr.style.visibility='hidden'; isheet.src=nr; } }
  else if(act==='exp') exportData(a.dataset.fmt);
});
function selectQ(){ const q=$('#q'); q.focus({preventScroll:true}); q.select(); try{ q.setSelectionRange(0,q.value.length); }catch(e){} }
function afterPick(row){ if(row.dataset.src==='s') selectQ(); }
// lift the plate bar over the on-screen keyboard (iOS keeps the layout viewport; the visual viewport shrinks)
if(window.visualViewport){ const vv=visualViewport, kbf=()=>{ const kb=Math.max(0,innerHeight-vv.height-vv.offsetTop); frame.style.setProperty('--kb',kb+'px'); frame.classList.toggle('kb',kb>80); }; vv.addEventListener('resize',kbf); vv.addEventListener('scroll',kbf); }
$('#psheet').addEventListener('click',()=>{},true);

/* ---------- boot ---------- */
renderHalls(); renderBar(); renderEvents(); setIdle(); $('.tbar .ind').style.transform='translateX(0)';
const qs=new URLSearchParams(location.search), state=qs.get('state');
const W=(n)=>byName('W','lunch',n);
function bench(){ addDish('lunch',W('Beef Brisket Noodle Bowl').k,BYK.lunch[W('Beef Brisket Noodle Bowl').k].refs,'Beef Brisket Noodle Bowl'); const g=BYK.lunch[W('Golden BBQ Chicken Thigh').k]; addDish('lunch',g.k,g.refs,g.n); addDish('lunch',g.k,g.refs,g.n); }
const hallQ=qs.get('hall')||'W';
if(qs.has('pins')){ S.pins=['Wasabi','Tamales',"Peet's Coffee & Tea",'Harvest Market','Procrastination Station'].slice(0,+qs.get('pins')); renderPins(); }   // screenshots: not saved
if(qs.has('events')){ EVENTS=P.events.slice(0,+qs.get('events')); renderEvents(); setIdle(); }
// debug frames wait for the webfonts, or the FLIP rects would be measured on fallback metrics
if(qs.has('progress')) document.fonts.ready.then(()=>{ openHall(hallQ,'debug'); XP=+qs.get('progress'); paint(XP,0); });
if(qs.has('scroll')) document.fonts.ready.then(()=>{ openHall(hallQ,'debug'); const y=+qs.get('scroll'); $('#mscroll').scrollTop=y; paint(1,y); });
if(state==='menu'||state==='collapsed'||state==='index'){ openHall(hallQ,true);
  if(state==='collapsed'||state==='index'){ $('#mscroll').scrollTop=520; paint(1,520); if(state==='index') openIdx(); } }
if(state==='franklin'){ openHall('F',true); }
if(state==='cafes'){ S.lastHall='W'; openPage('cafes'); }

if(state==='stations'){ openHall('W',true); $('#mscroll').scrollTop=520; paint(1,520); updSwitch(true); openIdx(); }
if(state==='places'){ goSearch(null,'lunch'); $('#q').value='coffee'; S.q='coffee'; renderSearch(); }

if(state==='typed'){ goSearch(null,'lunch'); const b=BYK.lunch[norm('Beef Brisket Noodle Bowl')]; addDish('lunch',b.k,b.refs,b.n); $('#q').value='bbq'; S.q='bbq'; renderSearch(); }
if(state==='lens'){ goSearch(null,'lunch'); S.lenses.add('protein'); S.lenses.add('halal'); renderLenses(); renderSearch(); $('#q').blur(); }
if(state==='nomatch'){ goSearch(null,'lunch'); $('#q').value='chobani'; S.q='chobani'; renderSearch(); }
if(state==='plate'){ openHall('W',true); bench(); if(plateOpen()) psheet.to('mid'); }
if(state==='split'){ bench(); const g=BYK.lunch[norm(byName('F','lunch',M.F.lunch[3][1][0][0]).n)]; addDish('lunch',g.k,{F:g.refs.F},g.n); if(plateOpen()) psheet.to('mid'); }
if(state==='logged'){ bench(); logPlate(S.plates[0]); clearTimeout(barT); }
if(state==='you'){ bench(); logPlate(S.plates[0]); clearTimeout(barT); barMode='plate'; renderBar(); setTab('you'); }
if(state==='dish'){ openHall('W',true); openDish(W('Beef Brisket Noodle Bowl')); }
if(state==='custom'){ goSearch(null,'lunch'); $('#q').value='chobani'; S.q='chobani'; renderSearch(); openCustom('chobani'); }
window.__S=S; window.__dayTotal=dayTotal; window.__plateHalls=plateHalls; window.__totals=totals;
