<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#3b0a0f">
<title>UDine M2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dm:#3b0a0f; --vm:#881c1c; --gold:#c99a2e; --chalk:#f8f9fb; --ink:#24171a; --slate:#6e6266;
  --tint:#f3e4e4; --hair:rgba(36,23,26,.12); --field:#eceef2;
  --st:24px; --sb:10px;
  /* motion tokens (mirrored in JS as MO; CONCEPT.md is the spec for mobile/src/lib/motion.ts) */
  --d-press:90ms;   --e-press:cubic-bezier(.2,0,0,1);
  --d-settle:200ms; --e-settle:cubic-bezier(.2,0,0,1);
  --d-cont:500ms;   --e-emph:cubic-bezier(.2,0,0,1);   /* --e-emph is replaced at boot by the M3 emphasized path (EMPH_CSS) */
  --d-exit:160ms;   --e-exit:cubic-bezier(.4,0,1,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a0b0f}
body{font-family:"Libre Franklin",system-ui,sans-serif;color:var(--ink);font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,.band:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.num,.o{font-family:Oswald,sans-serif;font-variant-numeric:tabular-nums}
#frame{position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;background:var(--chalk);top:50%;transform:translateY(-50%);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
@media (max-width:500px){
  #frame{width:100vw;height:100dvh;border-radius:0;top:0;transform:none;box-shadow:none}
  :root{--st:max(24px,env(safe-area-inset-top));--sb:max(10px,env(safe-area-inset-bottom))}
}
#probe{position:absolute;visibility:hidden;height:var(--st);width:var(--sb)}
.hide{display:none!important}
.tab{position:absolute;inset:0}
#halls,#search,#you{background:var(--chalk)}   /* every pane is opaque: a crossfade never shows what's under it */
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.pad-b{height:calc(150px + var(--sb))}

/* press feedback (token press in, release out): scale for compact controls, tint for full-width rows/bands */
/* press: finger down within 90 ms; release settles back, no overshoot anywhere */
.btn,.gbtn,.obtn,.custom,.chip,.hchip,.add,.step button,.icon,.tbar button,.mts button,.ptabs button,.vs button,.tbtn,.check i{transition:transform var(--d-settle) var(--e-settle),background-color var(--d-settle) var(--e-settle),color var(--d-settle) var(--e-settle),box-shadow var(--d-settle) var(--e-settle)}
.btn.down,.gbtn.down,.hchip.down,.obtn.down,.custom.down,.chip.down,.add.down,.step button.down,.icon.down,.tbar button.down,.mts button.down,.ptabs button.down,.vs button.down,.tbtn.down{transform:scale(.97);transition-duration:var(--d-press);transition-timing-function:var(--e-press)}
.row,.lrow,.prow2,#stidx button,#days .day,.check,.prow,.evcard,.swbtn,.dayc,.pin{transition:background-color var(--d-settle) var(--e-settle)}
.row.down,.lrow.down,.prow2.down,.check.down,.prow.down{background:rgba(36,23,26,.06);transition-duration:var(--d-press)}
#stidx button.down,#days .day.down{background:rgba(36,23,26,.06);transition-duration:var(--d-press)}
.evcard.down,.swbtn.down,.dayc.down,.pin.down{background:rgba(255,255,255,.08);transition-duration:var(--d-press)}
.band.down .press{opacity:1;transition-duration:var(--d-press)}
.fadein{animation:fadeIn var(--d-settle) var(--e-settle) both}
@keyframes fadeIn{from{opacity:0}}
/* ghosts: the outgoing content of a container transform */
.pdim{position:absolute;inset:0;background:rgb(36,10,14);opacity:0;pointer-events:none}
/* push (iOS navigation): the incoming screen's leading edge casts a soft shadow on the screen it covers, only while it moves */
.pushing{box-shadow:-1px 0 0 rgba(36,10,14,.08),-10px 0 28px rgba(36,10,14,.16)}

/* ---------- tab bar ---------- */
.tbar{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--hair);display:flex;padding-bottom:var(--sb)}
.tbar button{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--slate);position:relative}
.tbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbar button[aria-selected=true]{color:var(--vm)}
.tbar .ind{position:absolute;top:-1px;left:0;height:3px;width:calc(100% / 3);background:var(--vm);transition:transform var(--d-settle) var(--e-settle);pointer-events:none}

/* ---------- plate bar ---------- */
#bar{position:absolute;left:0;right:0;z-index:39;bottom:calc(57px + var(--sb));background:var(--dm);color:#fff;transform:translateY(110%);transition:transform var(--d-cont) var(--e-emph);touch-action:none}
#bar.on{transform:none}
#frame #bar.insheet,#frame.kb #bar.insheet{position:relative;bottom:auto;transform:none;transition:none;flex:none;z-index:auto}
#frame.kb .tbar{display:none}
#frame.kb #bar{bottom:var(--kb)}
#bar .in{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 12px 8px 20px}
#bar .txt{flex:1;min-width:0}
#bar .l1{font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .l2{font-size:13px;color:rgba(255,255,255,.8);margin-top:2px;white-space:nowrap}
#bar .l2 b{font:600 26px/1 Oswald,sans-serif;color:#fff;font-variant-numeric:tabular-nums;margin-right:2px}
#bar .l2 b+span{margin-right:12px}
#bar .acts{display:flex;gap:8px}
.gbtn{height:48px;min-width:84px;padding:0 18px;border-radius:8px;background:var(--gold);color:var(--dm);font-weight:700;font-size:16px}
.obtn{height:44px;padding:0 14px;border-radius:8px;border:1.5px solid rgba(255,255,255,.7);color:#fff;font-weight:600;font-size:15px}
#bar .dots{position:absolute;left:0;right:0;top:5px;display:flex;justify-content:center;gap:5px}
#bar .dots i{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
#bar .dots i.on{background:var(--gold)}
#bar .peek{position:absolute;left:10px;right:10px;top:-5px;height:5px;background:#5a1820;border-radius:3px 3px 0 0}
.roll{display:inline-block;position:relative;overflow:hidden;vertical-align:bottom}
.roll>span{display:inline-block}

/* ---------- halls ---------- */
.hhead{background:var(--dm);color:#fff;padding:calc(var(--st) + 10px) 20px 16px}
.hhead .r1{display:flex;justify-content:space-between;align-items:baseline;height:30px}
.brand{font:600 22px Oswald,sans-serif;color:var(--gold)}
.hhead .date{font-size:15px;color:rgba(255,255,255,.8)}
.hhead h1{font:600 52px/1.05 Oswald,sans-serif;margin:2px 0 0}
#mdim{position:absolute;inset:0;background:rgb(36,10,14);opacity:0;pointer-events:none}
/* events: a fixture list. One row type, on the maroon band in Search and on chalk inside a hall menu */
/* events (round 4: cards again): the event's own banner in a felt edge and gold stitching, title and date under it.
   A row of cards with native scroll-snap and a peek of the next one, on the maroon band. */
.sdisc{background:var(--dm);padding:4px 0 16px;overflow:hidden}
.sdisc h2{font:600 22px/1.2 Oswald,sans-serif;color:#fff;margin:0;padding:10px 20px 0}
.evc{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;padding:12px 0 4px 20px;margin:0;scrollbar-width:none;overscroll-behavior-x:contain}
.evc::-webkit-scrollbar{display:none}
.evc::after{content:"";flex:0 0 8px}   /* the end gutter is the 12px gap + this 8px spacer = 20, matching the start (no end padding: WebKit drops it in flex scrollers) */
.evc.one::after{display:none}
.evc .evcard{flex:0 0 280px;scroll-snap-align:start;display:block;text-align:left;color:#fff}
.evc.one .evcard{flex-basis:calc(100% - 20px)}
.evcap{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.evtt{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.92)}
.evtag{flex:none;color:var(--gold);font:600 15px/1.3 Oswald,sans-serif;font-variant-numeric:tabular-nums}
/* the in-menu note is still a quiet row on chalk */
.evrow{display:flex;align-items:baseline;gap:12px;width:100%;min-height:52px;padding:14px 20px;text-align:left;position:relative}
.evrow .evtt{white-space:normal;color:var(--dm)}
.evnote{color:var(--dm);border-bottom:1px solid var(--hair)}
.evnote .evtag{color:var(--vm);font-size:16px}
.evnote.down{background:rgba(36,23,26,.06)}
/* event page: the bar, the framed banner and the date sit on one deep-maroon surface, the ground the card has in Search
   (the felt frame needs maroon around it) */
.evband{position:relative;z-index:1;background:var(--dm);margin:-8px -20px 0;padding:16px 20px 20px}
.evband .pstat{padding:12px 0 0}
/* the event page is the card's maroon ground throughout (round 7 review): banner framed in felt, the date, the actions */
.page[data-p=event]{background:var(--dm);display:flex;flex-direction:column}
.page[data-p=event] .pbody{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;padding-bottom:56px}   /* a poster: the group sits at the optical centre of what the bars leave, not stranded at the top */
.page[data-p=event] .evpatch{padding:7px;background:var(--vm)}
.page[data-p=event] .evpatch img{border-radius:2px}
.page[data-p=event] .evpatch::after{inset:2.5px}   /* the stitch runs in the felt, around the picture, never over it */
.evband .stack{margin-top:24px}
.evbtn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;text-decoration:none;font-size:17px}
.evband .pstat b{color:var(--gold)}
.page:has(.evband) .pbar{background:var(--dm)}
.evpatch{position:relative;display:block;aspect-ratio:1024/432;border-radius:6px;overflow:hidden;background:var(--vm);box-shadow:0 0 0 3px #fff}
.evpatch img{display:block;width:100%;height:100%;object-fit:cover}
.evpatch::after{content:"";position:absolute;inset:4px;border-radius:3px;border:1.5px dashed rgba(201,154,46,.95);pointer-events:none}
.field svg{width:20px;height:20px;stroke:var(--vm);fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.band{display:block;position:relative;width:100%;height:112px;overflow:hidden;background:var(--vm);margin-top:1px;text-align:left;color:#fff;touch-action:manipulation}
#bands{background:var(--dm);display:flow-root}   /* flow-root: the first band's 1px top margin stays a maroon seam instead of collapsing out onto the chalk */
.win{position:absolute;left:0;right:0;top:0;height:var(--hh)}
.ph{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.ph-W{background-image:url(__IMG_W__);background-position:72% 0}
.ph-F{background-image:url(__IMG_F__);background-position:42% 0}
.ph-H{background-image:url(__IMG_H__);background-position:60% 0}
.ph-S{background-image:url(__IMG_S__);background-position:30% 40%}
.ph-B{background-image:url(__IMG_B__);background-position:62% 0}
.duo{position:absolute;inset:0;isolation:isolate}
.duo .g{filter:grayscale(1) contrast(1.12)}
.duo .t{position:absolute;inset:0;background:#c4434b;mix-blend-mode:multiply}
.duo .s{position:absolute;inset:0;background:var(--dm);mix-blend-mode:screen}
.lgrad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(59,10,15,.82) 0,rgba(59,10,15,.55) 45%,rgba(59,10,15,0) 75%)}
.press{position:absolute;inset:0;background:rgba(59,10,15,.22);opacity:0;transition:opacity var(--d-settle) var(--e-settle)}
.let{position:absolute;right:0;width:200px;height:200px;pointer-events:none;overflow:visible}
.band .let{top:-6px}
.let .felt{fill:#fff;stroke:#fff;stroke-width:12px;stroke-linejoin:round}
.let .gold{fill:var(--gold);stroke:var(--dm);stroke-width:1.5px;stroke-dasharray:5 4}
.let text{font:700 210px Oswald,sans-serif}
.bt{position:absolute;left:20px;top:16px}
.bt .nm,.mt .nm{font:600 32px/1 Oswald,sans-serif;transform-origin:0 100%}
.bt .st,.mt .st{font-size:15px;margin-top:7px;color:rgba(255,255,255,.86)}
.sec{padding:22px 20px 0}
.sec h2{font:600 22px/1.2 Oswald,sans-serif;color:var(--dm);margin:0 0 4px}
.lrow{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid var(--hair);width:100%;text-align:left;padding:8px 0;gap:12px}
.lrow:last-child{border-bottom:0}
.lrow .a{font-weight:600}
.lrow .b{font-size:13px;color:var(--slate);margin-top:2px}
.lrow .r{font-size:15px;color:var(--vm);font-weight:500;white-space:nowrap}

/* ---------- hall menu ---------- */
#menu{position:absolute;inset:0;z-index:5}
/* container transform: the opaque container surface, and the source's content drawn inside it while it fades out */
#mcont{position:absolute;inset:0;background:var(--chalk)}
#mghost{position:absolute;left:0;right:0;top:0;pointer-events:none;z-index:4}
#mghost.gband{overflow:hidden;background:var(--vm);color:#fff;text-align:left}
#mghost.gband .let{top:-6px}
#mghost.rowsrc{background:var(--chalk);overflow:hidden}
#mghost.rowsrc>*{width:100%}
.row.here{background:rgba(136,28,28,.07)}
/* pinned cafés (round 7): the hall band at three-quarter scale, in the same rack and the same maroon grade (grayscale duotone
   + the deep-maroon left gradient). 84 px (band 112), Oswald 24 (32), 14 px status, the same 20 px inset. No varsity letter.
   Like a hall band, it is a window into its page header's photo (.win), so the open is the same container transform. */
#pins:empty{display:none}
.band.pin{height:84px}
.pin .bt{top:14px}
.pin .bt .nm{font-size:24px}
.pin .bt .st{font-size:14px;margin-top:6px}
.hcards{background:var(--dm);display:flow-root;margin:4px 0 8px}
.band.hcard{height:76px}
.hcard .bt{top:13px}
.hcard .bt .nm{font-size:24px}
.hcard .bt .st{font-size:14px;margin-top:6px;display:flex;align-items:center;gap:10px}
.ph-C{background-image:var(--img);background-position:50% 50%}
#pins{background:var(--dm);display:flow-root}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb{flex:none;width:64px;height:34px;border-radius:5px;overflow:hidden;background:var(--hair)}
.thumb.nophoto{background:var(--vm)}
.lrow .lt{display:flex;align-items:center;gap:12px;min-width:0}
.prow2 .lt{display:flex;align-items:center;gap:12px;min-width:0}
.pinb svg{fill:none}
.pinb[aria-pressed=true] svg{fill:var(--gold);stroke:var(--gold)}
/* where and when a dish is served (Search rows), and its servings (detail) */
.row .tags .ht{width:18px;height:18px;font-size:12px}
/* where (round 5): a meal and a clock time, then the halls serving it as felt-letter tags on deep maroon (the band's pairing at button size) */
.where{margin-top:18px}
.wl+.wl{margin-top:14px}
.wt{font:600 20px/1.2 Oswald,sans-serif;color:var(--dm);margin:0 0 8px}
.wl.more .wt{font:600 17px/1.2 Oswald,sans-serif;color:var(--vm)}
.wc{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 8px;border-radius:8px;background:var(--dm);color:#fff;font:600 18px/1 Oswald,sans-serif}
.hchip .hl{position:relative;display:grid;place-items:center;width:28px;height:28px;border-radius:4px;background:var(--gold);color:var(--dm);font:700 18px/1 Oswald,sans-serif;font-style:normal}
.hchip .hl::after{content:"";position:absolute;inset:2px;border-radius:2px;border:1px dashed rgba(59,10,15,.75)}
.hchip.cafe{padding-left:16px}   /* a café has no varsity letter: its name alone, on the same deep-maroon tag */
.tags .cnm{font-size:13px;line-height:1.3;color:var(--slate);text-align:right;text-wrap:balance}
.lane .tags:has(.cnm){margin-right:4px;max-width:110px}
.mg .tags .cnm{margin-left:4px}
.lnext{font-size:13px;color:var(--slate);margin-right:2px}
#mscroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior-y:contain}
#mspace{height:calc(var(--hh) + var(--th,48px) + var(--sw,48px))}   /* the header and its pinned rows (round 9: a café can have one or none) */
#mlist{background:var(--chalk);min-height:100%}
#mhead{position:absolute;left:0;right:0;top:0;height:var(--hh);overflow:hidden;z-index:2;background:var(--vm);will-change:transform;pointer-events:none}
#mhead .phw{position:absolute;inset:0;will-change:transform}
.tgrad{position:absolute;left:0;right:0;top:0;height:calc(var(--st) + 80px);background:linear-gradient(rgba(59,10,15,.6),rgba(59,10,15,0))}
.bgrad{position:absolute;left:0;right:0;bottom:0;height:240px;background:linear-gradient(rgba(59,10,15,0),rgba(59,10,15,.5) 30%,rgba(59,10,15,.74) 50%,rgba(59,10,15,.93) 76%)}
#msolid{position:absolute;inset:0;background:var(--vm);opacity:0}

#mhead .let{top:calc(var(--st) + 26px)}
.mt{position:absolute;left:20px;bottom:50px;color:#fff}
.mt .nm{font-size:40px;display:block;width:max-content}
#mctl{position:absolute;left:0;right:0;top:0;height:calc(var(--st) + 52px);padding-top:var(--st);z-index:4;display:flex;justify-content:space-between;align-items:center;padding-left:4px;padding-right:4px;pointer-events:none}
#mctl button{pointer-events:auto}
.icon{width:48px;height:48px;display:grid;place-items:center;color:#fff}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#mtabs{position:absolute;left:0;right:0;top:var(--hh);height:48px;z-index:3;background:var(--dm);display:flex;will-change:transform}
/* round 9c: every meal is visible. The meal row holds only the meals (14 px, sharing the row; Worcester's five fit at 360 px
   with 12 px between labels), never scrolled, cut or ellipsized. The day cell ends the station row: gold Oswald and a
   chevron, the station switcher's material, so the row reads "where in the list | which day". One arrangement for every
   place, a one-menu café included. */
.dayc{flex:none;display:flex;align-items:center;gap:6px;height:47px;padding:0 20px 0 16px;color:var(--gold);box-shadow:inset 1px 0 rgba(255,255,255,.14);text-align:left}
.dayc .o{font:600 20px/1 Oswald,sans-serif;white-space:nowrap}
.dayc svg{width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mts{flex:1;min-width:0;display:flex;position:relative;padding:0 4px}
.mts button{flex:1 1 auto;height:48px;color:rgba(255,255,255,.8);font-size:14px;font-weight:500;white-space:nowrap;position:relative;padding:0 6px}
.mts button[aria-selected=true]{color:#fff;font-weight:600}
.mts .ul{position:absolute;left:0;bottom:0;height:3px;width:1px;background:var(--gold);transform-origin:0 0;transition:transform var(--d-settle) var(--e-settle);pointer-events:none}
.sth{display:flex;align-items:flex-end;width:100%;height:50px;padding:0 20px 6px;margin:0;background:var(--chalk);font:600 22px Oswald,sans-serif;color:var(--dm);text-align:left}


/* station row: the last row of the header (photo -> name -> meals -> station); it grows down into the roster */
/* a café in the hall screen (round 7): the same photo header, grade, name and collapse into the maroon bar. A café has no
   meals, stations, letter or busy board, so those rows aren't drawn and the name sits lower. */
#menu.cafe #mhist{display:none}
/* round 9b: a place UMass publishes no photo for (Charles River) is drawn on the band's own maroon ground, never a stand-in */
#menu.nophoto #mhead .phw,.band.nophoto .win{display:none}
#menu.nophoto #mhead{background:var(--vm)}
#menu.nomenu #mtabs,#menu.nomenu #mswitch,#menu.one #mtabs{display:none}   /* round 9: a café without a dish menu has no pinned rows; a one-menu café has no tab row */
#menu.cafe .mt{bottom:22px}
/* the status line is the schedule's other door: a button, with a chevron quieter than the gold ones in the rows below */
#mts{display:flex;align-items:center;gap:5px;pointer-events:auto;text-align:left;padding:12px 16px 12px 0;margin:-5px 0 -12px;color:rgba(255,255,255,.86)}
#mts.none{visibility:hidden}
#mts .sch{width:14px;height:14px;flex:none;stroke:rgba(255,255,255,.6);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mt .bz.ghost{visibility:hidden}   /* another day, or offline: no live data, but the name and status stay exactly where today has them */
#mctl .pinb svg{fill:none}
#mctl .pinb[aria-pressed=true] svg{fill:currentColor;stroke:currentColor}   /* white like the back chevron: gold disappeared on photos */
#mctl .icon svg{filter:drop-shadow(0 1px 2px rgba(36,10,14,.65))}   /* back and pin read on any photo */
.cbody{padding:20px 20px 0}
.cbody .desc{margin:0;line-height:1.5}
.cfacts{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;line-height:1.4}
.cfacts dt{font-weight:600;color:var(--dm)}
.cfacts dd{margin:0;color:var(--slate)}
.cbody .h3{margin-top:24px}
.cbody .lrow{min-height:48px;padding:0}   /* a retail menu lists names only: rows as tight as a list of names */
.cbody .lrow .add{width:44px;height:44px;margin-right:-10px}
#mswitch{position:absolute;left:0;right:0;top:calc(var(--hh) + var(--th,48px));height:48px;z-index:3;background:var(--dm);border-top:1px solid rgba(255,255,255,.12);will-change:transform;display:flex}
#menu.one #mswitch{border-top:0}
.swbtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:47px;padding:0 20px;color:var(--gold);text-align:left}
.swbtn:has(.o:empty){visibility:hidden}   /* nothing posted, or not loaded: no station to name */
.swbtn .o{font:600 20px/1 Oswald,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swbtn svg{width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--d-cont) var(--e-emph)}
.swbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.row{display:flex;align-items:center;min-height:64px;padding:6px 8px 6px 20px;gap:8px;position:relative}
.row::after{content:"";position:absolute;left:20px;right:0;bottom:0;height:1px;background:var(--hair)}
.row .tx{flex:1;min-width:0}
/* the control lane is always as wide as the stepper, so + -> stepper never re-wraps the name */
.row>.add{margin-left:66px}
.row .n{font-weight:600;line-height:1.25}
.row .m{font-size:13px;color:var(--slate);margin-top:3px;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.row.later .m{column-gap:16px}
/* meta groups (round 8): numbers | scores | where. Each group wraps whole; a wrapped line starts flush under the name.
   Round 7's spacing exactly; the score tiles (42 px for both) fit after it on one line, even at 360 px. */
.mg{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
.mg .tags{margin-left:0}
/* Search, now: the halls serving it sit under its +, in the control lane, so the meta line holds only the dish's own numbers
   and a row has the same shape with the scores on or off. (Later rows have no +: their "Dinner B" stays in the meta line.) */
.lane{flex:none;width:114px;min-height:66px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}   /* fits + or stepper over the letters: adding never changes the row's height */
.lane>.add.ghost{margin:2px}
.lane .tags{margin:0 14px 0 0}
.mg .lnext+.tags{margin-left:6px}
/* scores: an Oswald figure with its scale beside it. Healthfulness: seven bars (the ratings panel's), carbon: footprint + letter */
/* score tiles (round 8b): portrait, rounded, never square, never maroon: unlike a hall letter in shape and colour */
.tile{display:block;width:18px;height:22.5px;flex:none}
.tile text{font:600 14px Oswald,sans-serif}
.sc{align-self:center;gap:6px}
.row .m .sc{margin-block:-1px}   /* a 22.5 px tile rides in the 21.6 px meta line without growing it */
.hs,.cs{display:inline-flex}
.row .m b{font:500 15px Oswald,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.row .m .gap{width:8px}
.star{color:var(--vm);font-size:13px;margin-left:4px}
.add{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;color:var(--vm);flex:none}
.add svg,.step svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.add.ghost{box-shadow:inset 0 0 0 1.5px rgba(136,28,28,.45);width:44px;height:44px;margin:2px}
.row>.add.ghost{margin-left:68px}
.step{display:flex;align-items:center;background:var(--tint);border-radius:8px;height:44px;flex:none}
.step button{width:44px;height:44px;display:grid;place-items:center;color:var(--vm)}
.step .q{min-width:26px;text-align:center;font:600 20px Oswald,sans-serif;color:var(--dm);font-variant-numeric:tabular-nums}
.ht{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:600 13px/1 Oswald,sans-serif;font-style:normal;color:var(--slate);box-shadow:inset 0 0 0 1px rgba(110,98,102,.45);margin-left:2px}
.ht.on{background:var(--dm);color:var(--gold);box-shadow:none}
/* embroidered patch: gold felt, maroon stitching, maroon glyph. Same family as the chenille hall letters */
.tg{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:var(--gold);color:var(--dm);margin-left:6px;vertical-align:-3px;position:relative}
.tg::after,.mk::after{content:"";position:absolute;inset:2px;border-radius:2px;border:1px dashed rgba(59,10,15,.75);pointer-events:none}
.tg .gl{width:12px;height:12px}
.nw{white-space:nowrap}
.tags{display:inline-flex;gap:2px;margin-left:6px}
/* station list: a standard bottom sheet (isheet) */
#stidx{margin:0 -20px}
#stidx button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:0 20px 0 16px;text-align:left;font-size:17px;font-weight:500;color:var(--ink);border-left:4px solid transparent}
#stidx button.cur{border-left-color:var(--vm);font-weight:700;color:var(--vm)}
#stidx button .c{font:500 16px Oswald,sans-serif;color:var(--slate)}
.dietnote{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px 4px 20px;font-size:14px;line-height:1.35;color:var(--slate);border-bottom:1px solid var(--hair)}
.dietnote .tbtn{flex:none}
.row .m .cont{color:var(--vm);font-weight:600}   /* a revealed dish that lists an allergen you avoid: said first */
.dish .dal .av{color:var(--vm);font-weight:700}
/* round 9: what a list says when it has no dishes: nothing posted, not saved offline, didn't load, loading */
.mst{padding:28px 20px 8px}
.mst .empty{padding:0 0 16px;text-wrap:pretty}
.mstate{display:grid;place-items:center;height:160px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(136,28,28,.18);border-top-color:var(--vm);animation:spin 900ms linear infinite,spinIn 1ms 400ms both}   /* the platform's activity indicator, only after 400 ms */
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes spinIn{from{visibility:hidden}to{visibility:visible}}
/* the schedule (round 9): the place's where and when, in the station switcher's sheet */
.sched .schn{font:600 28px/1.15 Oswald,sans-serif;color:var(--dm);margin:2px 0 0}
.schw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 0}
.scha p{margin:0;font-size:15px;line-height:1.4;color:var(--slate)}
.dirb{flex:none;display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--vm);color:var(--vm);font-weight:600;font-size:15px;text-decoration:none}
.schp{margin:10px 0 0;font-size:15px;line-height:1.4;color:var(--slate)}
.schp b{color:var(--dm);font-weight:600;margin-right:6px}
.schd{margin:20px 0 0;font-size:15px;line-height:1.5;color:var(--ink)}
#days{margin:16px -20px 0;border-top:1px solid var(--hair)}
#days .day{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 20px 0 16px;text-align:left;font-size:17px;font-weight:500;color:var(--ink);border-left:4px solid transparent}
#days .day .r{font-size:15px;font-weight:400;color:var(--slate);white-space:nowrap}
#days .day.cur{border-left-color:var(--vm);font-weight:700;color:var(--vm)}
#days .day.cur .r{color:var(--vm);font-weight:500}
#days .mws{padding:0 20px 10px 36px;border-left:4px solid var(--vm);margin-top:-4px}
#days .mw{display:flex;justify-content:space-between;gap:12px;font-size:15px;line-height:1.45;color:var(--ink)}
#days .mw span+span{color:var(--slate)}
#days .mws .evrow{padding:0;min-height:44px;align-items:center;justify-content:space-between}   /* the holiday's hours live in its event: a row that opens it */
.netl{position:absolute;right:20px;top:calc(var(--st) + 40px);display:flex;flex-direction:column;align-items:flex-end;font-size:15px;color:rgba(255,255,255,.8);text-align:right}
.netl .obtn{margin-top:6px}
.hhead{position:relative}
.dh{margin-top:12px}
.check .cb{display:block;font-size:13px;font-weight:400;color:var(--slate);margin-top:2px}
.pbody>.check:last-child{border-bottom:0}
.dh~.dh{margin-top:28px}
.pr{font:600 20px/1 Oswald,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:8px}
.tbtn{height:44px;padding:0 12px;color:var(--vm);font-weight:600;font-size:15px}

/* ---------- search ---------- */
.shead{position:relative;background:var(--dm);padding:calc(var(--st) + 12px) 20px 14px;overflow:hidden}
.shead .ph,.shead .duo{opacity:.55}
.shead .lgrad{background:linear-gradient(rgba(59,10,15,.3),rgba(59,10,15,.75))}
.field{position:relative;display:flex;align-items:center;gap:10px;height:52px;border-radius:8px;background:#fff;padding:0 4px 0 16px}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font:500 17px "Libre Franklin",sans-serif;color:var(--ink)}
.field input::placeholder{color:var(--slate);font-weight:400}
.field input::-webkit-search-cancel-button{display:none}
.stick{position:sticky;top:0;z-index:2}
.lenses{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none;background:var(--chalk);border-bottom:1px solid var(--hair)}
.lenses::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 14px;border-radius:8px;box-shadow:inset 0 0 0 1.5px rgba(110,98,102,.4);font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip[aria-pressed=true],.chip[aria-checked=true]{background:var(--tint);color:var(--dm);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--vm)}
.chip[aria-pressed=true]:not(:has(.gl)):not([data-act=unscope])::before{flex:none;content:"";width:10px;height:5px;margin:0 2px 3px 0;border:solid currentColor;border-width:0 0 2px 2px;transform:rotate(-45deg)}   /* a filter chip, selected: tonal with a check (M3), never a filled button */
.chip .x{font-size:18px;line-height:1}
#search{display:flex;flex-direction:column}
#search>*{flex-shrink:0}
#sres{flex:1}
.empty{padding:28px 20px 8px;color:var(--slate);font-size:16px;line-height:1.45}
.custom{display:flex;align-items:center;gap:10px;width:calc(100% - 40px);margin:8px 20px;min-height:52px;border-radius:8px;padding:0 16px;box-shadow:inset 0 0 0 1.5px rgba(136,28,28,.5);color:var(--vm);font-weight:600;text-align:left}
.custom.solid{background:var(--vm);color:#fff;box-shadow:none}

/* ---------- you & pages ---------- */
.yhead{background:var(--dm);color:#fff;padding:calc(var(--st) + 10px) 20px 18px}
.yhead .date{font-size:15px;color:rgba(255,255,255,.8);height:30px;display:flex;align-items:baseline}
.yhead h1{font:600 52px/1.05 Oswald,sans-serif;margin:2px 0 0}
.facts{border:2px solid var(--dm);padding:4px 12px 6px;background:#fff;color:var(--dm)}
.facts .cal{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:7px solid var(--dm);padding:2px 0 4px}
.facts .cal span{font-weight:700;font-size:18px}
.facts .cal b{font:700 44px/1 Oswald,sans-serif;font-variant-numeric:tabular-nums}
.facts .nr{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--dm);padding:7px 0 5px;font-weight:600;font-size:15px}
.facts .nr:last-child{border-bottom:0}
.facts .nr b{font:600 20px Oswald,sans-serif;font-variant-numeric:tabular-nums}
.meal{padding:12px 0;border-bottom:1px solid var(--hair)}
.meal .h{display:flex;justify-content:space-between;align-items:baseline}
.meal .h .a{font-weight:700}
.meal .h .t{font-size:13px;color:var(--slate)}
.meal .it{display:flex;justify-content:space-between;font-size:14px;color:var(--slate);margin-top:4px}
.meal .it b{font:500 15px Oswald,sans-serif;color:var(--ink)}
.chev{width:16px;height:16px;stroke:var(--slate);fill:none;stroke-width:2.2;flex:none}
.page{position:absolute;inset:0;z-index:30;background:var(--chalk);overflow-y:auto;overscroll-behavior-y:contain}
.bz{display:flex;align-items:center;gap:8px;font-size:14px;color:#fff;white-space:nowrap;transform-origin:0 100%}
.bt .bz{margin-top:6px}
.mt .bz{margin-top:8px;font-size:14px;flex-wrap:wrap;row-gap:5px;max-width:230px}
.mt .bzx{flex-basis:100%;font-size:14px;color:rgba(255,255,255,.86)}
.mt .bzx:empty{display:none}
.meter{display:inline-flex;gap:2px;align-items:flex-end;flex:none}
.meter i{width:5px;height:12px;border-radius:1px;background:rgba(255,255,255,.22)}
.meter i.on{background:var(--gold)}
.hist{position:absolute;left:20px;right:20px;bottom:10px;height:30px}
.hist svg{display:block;width:100%;height:100%;overflow:visible}
.evimg{display:block;width:100%;height:auto}
.chips1{display:flex;gap:8px;padding:12px 0 4px}
.ahd{position:sticky;top:calc(var(--st) + 52px);z-index:1;background:var(--chalk);font:600 22px/1.2 Oswald,sans-serif;color:var(--dm);padding:16px 0 6px;margin:0}
.lrow .r.off{color:var(--slate);font-weight:400}
.pstat{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0 4px}
.pstat b{font:600 26px Oswald,sans-serif;color:var(--vm)}
.pstat b.off{color:var(--slate)}
.pstat span{color:var(--slate);font-size:15px}
.h3{font:600 22px/1.2 Oswald,sans-serif;color:var(--dm);margin:22px 0 4px}
.sgrp{font:600 20px Oswald,sans-serif;color:var(--dm);padding:14px 20px 2px}
.prow2{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:8px 20px;text-align:left;position:relative}
.prow2::after{content:"";position:absolute;left:20px;right:0;bottom:0;height:1px;background:var(--hair)}
.prow2 .a{font-weight:600}.prow2 .b{font-size:13px;color:var(--slate);margin-top:2px}
.prow2 .r{font-size:14px;color:var(--vm);font-weight:500;white-space:nowrap}.prow2 .r.off{color:var(--slate);font-weight:400}
.gnote{padding:12px 20px 4px;font-size:15px;color:var(--slate)}
.gnote b{color:var(--vm);font-weight:600}
.pbar{position:sticky;top:0;z-index:2;background:var(--vm);color:#fff;height:calc(var(--st) + 52px);padding:var(--st) 4px 0;display:flex;align-items:center;gap:2px}
.pbar .o{font:600 22px Oswald,sans-serif;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
.pbody{padding:8px 20px 20px}
.check{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;border-bottom:1px solid var(--hair);text-align:left;font-weight:600}
.sec .check:last-child{border-bottom:0}
.check i{width:26px;height:26px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--slate);display:grid;place-items:center}
.check[aria-checked=true] i{background:var(--vm);box-shadow:none}
.check[aria-checked=true] i::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translateY(-2px) rotate(-45deg)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:8px;background:var(--vm);color:#fff;font-weight:700;font-size:17px}
.btn.line{background:none;color:var(--vm);box-shadow:inset 0 0 0 1.5px var(--vm)}
.vs,.stack{display:grid;gap:12px;margin-top:12px}
.vs button{min-height:96px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--hair);padding:16px;text-align:left;font:600 22px/1.15 Oswald,sans-serif;color:var(--dm)}
.vs .or{text-align:center;color:var(--slate);font-size:14px}

/* ---------- sheets ---------- */
#scrim{position:absolute;inset:0;z-index:50;background:rgb(36,10,14);opacity:0;pointer-events:none}
#pscrim{position:absolute;inset:0;z-index:37;background:rgb(36,10,14);opacity:0;pointer-events:none}
.sheet{position:absolute;left:0;right:0;top:0;height:100%;z-index:51;background:var(--chalk);border-radius:16px 16px 0 0;transform:translate3d(0,110%,0);display:flex;flex-direction:column;touch-action:none;will-change:transform}
/* the plate sheet is the plate bar grown taller: square, under the tab bar, the bar is its top edge */
#psheet{z-index:38;border-radius:0}
#isheet{height:calc(100% - var(--st) - 8px)}   /* as tall as its top detent leaves room for: the end of its content is never below the frame */
#psheet .sbody{padding-top:4px;padding-bottom:calc(84px + var(--sb))}
.grab{flex:none;height:22px;display:grid;place-items:center}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:rgba(36,23,26,.22)}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:0 20px calc(24px + var(--sb))}
.sbody>div{display:flow-root}
.sh1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:2px 0 6px}
.sh1 h2{font:600 34px/1.1 Oswald,sans-serif;color:var(--dm);margin:0}
.sh1 span{color:var(--slate);font-size:15px;text-align:right}
.ptabs{display:flex;gap:4px;margin:0 -8px 4px}
.ptabs button{height:44px;padding:0 10px;font-weight:600;font-size:15px;color:var(--slate);position:relative}
.ptabs button[aria-selected=true]{color:var(--dm)}
.ptabs button[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:4px;height:3px;background:var(--vm)}
.prow{display:flex;align-items:center;gap:8px;min-height:64px;border-bottom:1px solid var(--hair);position:relative}
.prow .tx{flex:1;min-width:0}
.prow .n{font-weight:600}
.prow .m{font-size:13px;color:var(--slate);margin-top:3px}
.prow .m b{font:500 15px Oswald,sans-serif;color:var(--ink)}
.sheet .facts{margin:16px 0}
/* dish detail: FDA label in the plate-totals treatment, marks, grades, allergens, ingredients */
.gl{width:16px;height:16px;flex:none;vertical-align:-3px}
.mk-in{display:inline-flex;margin-left:6px;color:#2f6f3a;vertical-align:-2px}
.mk-in .gl{width:15px;height:15px}
.chip .gl{margin-right:-2px}
.chip[aria-pressed=true] .gl path[stroke="#fff"]{stroke:var(--tint)}
.mks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mk{position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:5px;background:var(--gold);color:var(--dm);font:600 16px/1 Oswald,sans-serif}
.mk::after{inset:3px;border-radius:3px}
.alg{margin-top:14px;padding:7px 0 6px;border-top:4px solid var(--dm);border-bottom:1px solid var(--dm);color:var(--dm);font-size:15px;line-height:1.4}
.alg b{font:700 16px Oswald,sans-serif;margin-right:6px}
.label .lt{font:700 30px/1.1 Oswald,sans-serif;border-bottom:1px solid var(--dm);padding:2px 0 4px}
.label .ls{display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding:6px 0;border-bottom:7px solid var(--dm)}
.label .cal{border-bottom:4px solid var(--dm)}
.label .lr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--dm);padding:5px 0 4px;font-size:15px}
.label .lr b{font:inherit;font-weight:700}
.label .lr .dv{font:600 16px Oswald,sans-serif;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.label .lr.sub{padding-left:16px}
.label .lr.thin{font-size:13px;font-weight:700}
.label .lr.last{border-bottom:7px solid var(--dm)}
.label .lf{font-size:12px;color:var(--ink);padding:6px 0 2px;line-height:1.35}
/* ratings (round 8): its own panel next to the label, with its own rules: one 1 px rule between ratings, none after the
   last. No thick bar: a thick bar ends a label section, and this panel has none. */
.grades{padding:0 12px}
.gr{padding:10px 0;font-size:15px}
.gr+.gr{border-top:1px solid var(--dm)}
.gr,.gt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gr:has(.gt){display:block}
.gr b{font-weight:700}
.gt b{display:inline-flex;align-items:center;gap:6px}
.gs{margin:6px 0 0;font-size:13px;color:var(--ink)}
.sscale{display:inline-flex;gap:3px;align-items:flex-end}
.sscale i{width:17px;padding-bottom:7px;position:relative;text-align:center;font:500 14px/1 Oswald,sans-serif;font-style:normal;color:var(--slate)}
.sscale i::after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:4px;border-radius:2px;background:var(--c)}   /* the scale's colours, under its figures */
.hscale i{width:14px}
.sscale i.on{width:auto;padding:0 2px}
.sscale i.on::after{display:none}
.sscale .tile{width:26px;height:32.5px}
/* dish sheet (round 7). One spacing scale: 4 within a line group, 8 between the parts of a group, 16 before the action,
   24 between groups (identity, action, where, label, ingredients) */
.dish .dhd{display:flex;align-items:flex-start;gap:8px;position:sticky;top:0;z-index:2;background:var(--chalk);margin:0 -20px -4px;padding:0 20px 4px;box-shadow:0 -4px 0 var(--chalk);transition:box-shadow var(--d-settle) var(--e-settle)}   /* the name stays over the label as it scrolls */
.dish.stuck .dhd{box-shadow:0 -4px 0 var(--chalk),0 1px 0 var(--hair),0 10px 14px -8px rgba(36,10,14,.32)}   /* (the chalk above it covers sub-pixel slivers of what scrolls under) */   /* and is edged once something passes under it */
.dish .dn{flex:1;min-width:0;font:600 28px/1.15 Oswald,sans-serif;color:var(--dm);margin:4px 0 0}
.dish .favb{flex:none;margin:-6px -12px -12px 0;color:var(--vm)}   /* centred on the first line of the name, and no taller than it */

.dish .dsv{margin:4px 0 0;font-size:15px;color:var(--slate)}
/* round 10: the bowl builder. The station's own name heads its add-ins; each is a compact row with the row's stepper; the
   action is pinned to the sheet's foot in the plate bar's material (maroon, Oswald figures, the gold Log button) */
.dish .bh{font:600 20px/1.2 Oswald,sans-serif;color:var(--dm);margin:24px 0 4px}
.brow{display:flex;align-items:center;gap:8px;min-height:56px;border-bottom:1px solid var(--hair)}
.brow .tx{flex:1;min-width:0}.brow .n{font-weight:600;line-height:1.25}.brow .m{font-size:13px;color:var(--slate);margin-top:2px}

.dish.build .where{margin-top:24px}
#bfoot{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 12px calc(8px + var(--sb)) 20px;background:var(--dm);color:#fff}
#bfoot .txt{flex:1;min-width:0}
#bfoot .l2{font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap}

#bfoot .gbtn[disabled]{opacity:.45}
#isheet:has(#bfoot:not(.hide)) .sbody{padding-bottom:calc(92px + var(--sb));scroll-padding-bottom:calc(84px + var(--sb))}   /* anything scrolled into view clears the pinned foot */
.prow .pw{font-size:13px;color:var(--slate);margin-top:2px;line-height:1.3}
.row.syn{width:100%;text-align:left}
/* round 10: tracking off. The menu keeps its shape: hall rows keep their lane (empty), Search's letters rise into the + slot,
   the bar and every way to record are gone, and "where" takes the sheet's action slot */
#frame.notrack .row>.add,#frame.notrack .row>.step{visibility:hidden}
#frame.notrack .lane>.add,#frame.notrack .lane>.step{display:none}
#frame.notrack .lane{justify-content:flex-start;padding-top:10px}

.lrow .mc{display:flex;align-items:center;gap:6px;color:var(--slate);font-size:13px;white-space:nowrap}

.mealr .b{font-size:13px}

/* round 11: Search's network line and failed pair; Search UMass Dining; foods; café PDF pages; the OS's notification */
.netnote{margin:0;padding:10px 20px;font-size:14px;line-height:1.4;color:var(--slate);border-bottom:1px solid var(--hair);text-wrap:pretty}

.page[data-p=favs] .hrow{border-bottom:1px solid var(--hair);margin-bottom:8px}

.cbody .lrow .r{font-size:13px}
.osnote{position:absolute;z-index:75;left:8px;right:8px;top:calc(var(--st) + 6px);display:block;text-align:left;padding:12px 14px;border-radius:18px;background:rgba(244,244,244,.98);color:#111;box-shadow:0 6px 24px rgba(0,0,0,.25);font-family:system-ui,-apple-system,Roboto,sans-serif}
.osnote .oh{display:flex;justify-content:space-between;font-size:12px;color:#5a5a5a;margin-bottom:3px}

<script>
'use strict';
// Round 9: fifteen days of menus (Oct 8-22) for the halls and the 16 cafés with dish menus. MD[day][place][meal] is a list of
// [station, [dish index]]; DISHES holds each distinct dish once. A place is a hall letter or 'c<i>' (P.places[i]).
const DISHES = __DISHES__;
const MD = __MD__;
const DAYS = __DAYS__;                         // ISO dates; day 0 is today
const WIN = __WIN__;                           // place -> meal -> [open, close] minutes (hours.ts: standard windows clamped to the place's hours)
const ADDR = __ADDR__;                         // place -> [street, "lat,long"] (get_infov2's address and map_address)
const ALG = __ALG__;                           // the feed's allergens, in Dietary preferences' order
const PDFS = __PDFS__;                         // round 11: café name -> [[label, url, [page images]]], from get_infov2's retail menu links
const PACK = __PACK__;                         // round 11: OpenFoodFacts, recorded (packaged-2026-10-13.json): a search's hits and one product
const menuOf = (day, key) => (MD[day]||{})[key];   // every menu read goes through this: {meal: [[station, [dish]]]}, or nothing posted
const HALLS = ['W','F','H','B'];
const HN = {W:'Worcester',F:'Franklin',H:'Hampshire',B:'Berkshire'};
const P = __PLACES__;
const isCafe = k => k[0]==='c';
const LANE = k => PN(k)==='Charles River Campus' ? 'Charles River' : PN(k);   // round 9b: a Search lane's short name (its page and lists keep the full one)
const PN = k => isCafe(k) ? P.places[+k.slice(1)][0] : HN[k];             // a place's name
const PORD = k => isCafe(k) ? 4 + +k.slice(1) : HALLS.indexOf(k);         // halls first, then cafés in P.places' order
// round 9b: the Charles River Campus (Newton, area 4) exists only while You's toggle is on. Off, it appears nowhere; nothing
// of it is deleted (pins stay in S.pins, its plates are set aside in S.offPlates).
const NEWTON = 4, inNewton = k => isCafe(k) && P.places[+k.slice(1)][1]===NEWTON;
const placeOn = k => !inNewton(k) || S.newton;
const areasOn = () => [0,1,2,3,...(S.newton?[NEWTON]:[])];
const DISHMENU = new Set(MD.flatMap(d=>Object.keys(d)));                  // places with a dish menu on some day
// a café that never has more than one menu a day gets no tab row: its day cell leads the station row
const ONEMEAL = k => isCafe(k) && MD.every(d=>!d[k] || Object.keys(d[k]).length<=1);
const RIMG = __RIMG__;                         // UMass Dining's own location-card photos, by place name (and grab:W etc.)                         // real hours, payment, descriptions, menus (uapp/get_infov2), events (get_beacons_events)
const NOW = 12*60+41;                          // Thursday 12:41 PM (the brief's fixed clock)
const fmtT = m => m>=1439?'midnight': m===720?'noon' : `${(Math.floor(m/60)+11)%12+1}${m%60?':'+String(m%60).padStart(2,'0'):''} ${m<720?'AM':'PM'}`;
const span = (o,c) => `${fmtT(o)} to ${fmtT(c)}`;
const isOpen = ([o,c]) => NOW>=o && NOW<c;
const status = ([o,c]) => NOW<o ? `Opens ${fmtT(o)}` : NOW>=c ? 'Closed for today' : `Open until ${fmtT(c)}`;
const HOURS = Object.fromEntries(Object.entries(P.hours).map(([h,v])=>[h,status(v)]));
// Busy: same shape as get_infov2's `busy`. Values are SIMULATED for a Thursday lunch rush (the live capture was from the evening).
const NULL3 = [{in:30,pct:null},{in:60,pct:null},{in:90,pct:null}];
const BUSY = {
  W:{level:2,label:'Busy',pct:82,usual_pct:86,trend:'falling',vs_usual:'usual',outlook:[{in:30,pct:70},{in:60,pct:55},{in:90,pct:40}],calmer_at:'13:30',confidence:'good'},
  F:{level:1,label:'A little busy',pct:48,usual_pct:55,trend:'falling',vs_usual:'usual',outlook:NULL3,calmer_at:null,confidence:'new'},
  H:{level:0,label:'Not busy',pct:27,usual_pct:44,trend:'steady',vs_usual:'quieter',outlook:NULL3,calmer_at:null,confidence:'good'},
  B:{level:2,label:'Busy',pct:88,usual_pct:74,trend:'steady',vs_usual:'busier',outlook:[{in:30,pct:80},{in:60,pct:68},{in:90,pct:null}],calmer_at:null,confidence:'new'},
};
// Typical Thursday, busy % by hour from opening (SIMULATED; would come from our own occupancy-history table)
const TYPICAL = {
  W:[7,[15,25,30,22,30,62,86,70,40,30,45,70,82,60,40,30,22]],
  F:[7,[12,20,22,18,30,55,50,30,20,25,45,55,35,20]],
  H:[7,[10,18,20,16,28,44,40,25,18,22,40,48,30,18]],
  B:[11,[45,74,70,45,30,40,72,84,70,50,40,45,38]],
};
function busyRow(h, full){
  const b=BUSY[h], n=Math.max(1,Math.ceil(b.pct/20)), low=b.confidence!=='good';   // low confidence is carried by the word, never by the meter
  const word = low ? 'Probably '+b.label.toLowerCase() : b.label;
  let extra='';
  if(full){ if(b.calmer_at){ const [hh,mm]=b.calmer_at.split(':').map(Number); extra=`Calmer around ${fmtT(hh*60+mm)}`; }
    else if(b.vs_usual==='busier') extra='Busier than usual'; else if(b.vs_usual==='quieter') extra='Quieter than usual'; }
  return `<span class="meter" aria-hidden="true">${[0,1,2,3,4].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</span><span>${word}</span>${full?`<span class="bzx">${extra}</span>`:''}`;
}
const lamps = pct => Math.max(1,Math.ceil(pct/20));   // one quantization for the band meter and the header board
function histSVG(h){
  // scoreboard lamp board: one column of five lamps per hour, lit like the band meter. Now is gold.
  // The next hours use the live forecast when there is one, otherwise the typical Thursday.
  const [start, v]=TYPICAL[h], b=BUSY[h], n=v.length, W=350, Hh=30, gap=3, bw=(W-gap*(n-1))/n, lg=2, lh=(Hh-lg*4)/5;
  const nowI=Math.floor(NOW/60)-start;
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true">${v.map((x,i)=>{
    const o=i>nowI && b.outlook[i-nowI], val = i===nowI ? b.pct : (o && o.pct!=null ? o.pct : x), lit=lamps(val), X=(i*(bw+gap)).toFixed(1);

/* ---------- Health Connect / Apple Health (round 10), simulated ----------
   ?os=ios|android names the platform; ?health=allow|deny|revoked is what the OS answers. Each logged meal is written as one
   record; an edit rewrites it and a delete deletes it. Nothing is read back. HEALTH.records stands in for the platform's
   store (the test reads it). Which nutrient fields a platform accepts is to be checked at build time. */
const OSQ=new URLSearchParams(location.search), OS = OSQ.get('os')==='ios' ? 'ios' : 'android';
const HNAME = OS==='ios' ? 'Apple Health' : 'Health Connect';
const HEALTH = {answer: OSQ.get('health')||'allow', granted:null, denied:false, records:[]};   // granted: null = never asked
HEALTH.granted = S.health ? HEALTH.answer==='allow' : null;   // on with the OS no longer allowing it: revoked in system settings
const healthLive = () => S.track && S.health && HEALTH.granted===true;
function healthRecord(m){ const t=mealTotal(m); return {mealId:m.id, name:mealLabel(m), at:m.at, energyKcal:Math.round(t.cal), proteinG:+t.p.toFixed(1), carbsG:+t.c.toFixed(1), fatG:+t.f.toFixed(1)}; }
function healthWrite(m){ if(!healthLive()) return; const i=HEALTH.records.findIndex(r=>r.mealId===m.id), r=healthRecord(m); if(i>=0) HEALTH.records[i]=r; else HEALTH.records.push(r); }
function healthDelete(m){ if(!healthLive()) return; HEALTH.records=HEALTH.records.filter(r=>r.mealId!==m.id); }

/* ---------- bowls (round 10): a bowl is one plate item made of plate items ----------
   The feed links no base to its add-ins, so the stations decide (NOTES "Round 10"):
   - halls: Noodle Bowl, Pasta Bar and Omelet build on a natural base (a dish of at least 120 cal that isn't a sauce,
     topping, broth or dressing; at Omelet, the Omelet Bar dish); the station's other dishes are its add-ins;
   - unpriced Salad Bar and Deli Bar stations build on a synthetic base named after the station (round 11, owner) that
     carries no nutrition of its own: the bowl is only the sum of what was chosen. A by-the-pound bar gets none;
   - a hall's Noodle Bowl has exactly one base per day (round 11, baseOf): its soup or dish. A pho bar (two or more broths
     and the parts to go in them) has no single dish, so it gets the synthetic "Noodle Bowl";
   - cafés: a dish builds when its place and meal have an Add-ons or Toppings station; those dishes (with nutrition) are its
     add-ins. A bowl's nutrition is summed from its parts (grams summed, %DV from FDA values in the label). */
const stName = st => st.replace(/\s*\$.*$/,'').replace(/\s+Items$/,'').replace('Salad Bar/Dressings','Salad Bar').trim();
const NATURAL = {'Noodle Bowl':1,'Pasta Bar':1,'Omelet':1};
const isPartName = n => /sauce|topping|broth|dressing/i.test(n);
const isBaseAt = (st, d) => st==='Omelet' ? /omelet/i.test(d.n) : d.cal>=120 && !isPartName(d.n);
const stDishes = (day,h,meal,si) => MD[day][h][meal][si][1].map((_,di)=>DISH[did(day,h,meal,si,di)]);
// round 11: a part is named as one outside its parentheses ("Shrimp Tom Yum Soup (Chicken Broth)" is a soup); a dish word
// counts anywhere ("Bun Heo Quay (Crispy Pork Belly Bowl)")
const outside = n => n.replace(/\([^)]*\)/g,'');
const isPart = n => /\b(sauce|toppings?|broth|base|dressing)\b/i.test(outside(n));
const DISHW = /ramen|noodle|soup|stew|congee|bowl|curry|katsu/i;
// a hall Noodle Bowl's one base: the station's only dish; none for a pho bar (two or more broths: a bar of parts); otherwise the
// highest-calorie non-part whose name says it's a dish, or failing that the highest-calorie non-part (Masala Dosa, Khoa Soi)
function baseOf(day,h,meal,si){ const ds=stDishes(day,h,meal,si); if(ds.length===1) return ds[0];
  if(ds.filter(d=>/\b(broth|base)\b/i.test(outside(d.n))).length>=2) return null;
  const c=ds.filter(d=>!isPart(d.n)), w=c.filter(d=>DISHW.test(d.n));
  return (w.length?w:c).reduce((a,b)=>!a||b.cal>a.cal?b:a, null); }
const perLB = st => /\/\s*LB\b/i.test(st);   // "Salad Bar $11.50/LB", "Cold Bar Items $11.50/LB": by the pound, single dishes
// a pho builder (owner, 2026-10-14): one base is chosen from the station's choices and names the bowl; the rest are toppings.
// A hall pho bar's choices are its broths. A café's Noodle Bowl beside an Add-ons or Toppings station (Whitmore Café, Star
// Ginger) chooses one of the station's dishes, with the café's add-ons as toppings; a café pho bar chooses its broth.
const isBroth = d => /\b(broth|base)\b/i.test(outside(d.n));
function phoOf(day,h,meal,si,ds){ const y={label:'Noodle Bowl', head:'Noodle Bowl', h, meal, si, day, pho:true}, br=ds.filter(isBroth);
  const bar = br.length>=2 ? {...y, choices:br, parts:[...br, ...ds.filter(d=>!isBroth(d))]} : null;
  if(!isCafe(h)) return baseOf(day,h,meal,si) ? null : bar;
  // a café's add-ons first: Whitmore's "Beef Pho w/Spicy Green Curry Broth" names a broth but is a whole pho
  const ss=MD[day][h][meal], add=ss.map((s2,j)=>[s2[0].trim(),j]).filter(([n])=>/^(Add-ons|Toppings)$/.test(n)), tops=add.flatMap(([,j])=>stDishes(day,h,meal,j).filter(x=>x.cal>0));
  return tops.length ? {...y, choices:ds, parts:[...ds, ...tops], topHead:[...new Set(add.map(([n])=>n))].join(' and ')} : bar; }
// a synthetic bowl from what's chosen: a pho takes its chosen base's name; a bar has none
function synBowl(y, sel, h){ const c=y.pho && sel.find(([x])=>y.choices.includes(x)); return bowlDish(c?c[0]:null, sel.filter(e=>e!==c), y, h); }
function synOf(day,h,meal,si){ const st=MD[day][h][meal][si][0], nm=stName(st), ds=stDishes(day,h,meal,si);
  if(nm==='Noodle Bowl') return phoOf(day,h,meal,si,ds);
  if(!/^(Salad Bar|Deli Bar)$/.test(nm) || perLB(st)) return null;
  if(ds.filter(d=>d.price).length > ds.length*.1) return null;   // a bar of finished, priced dishes isn't a build
  return {label:nm, head:nm, h, meal, si, day, parts:ds}; }
function buildOf(d){ if(!d || d.id.startsWith('bowl:')) return null; const ss=(MD[d.day][d.h]||{})[d.meal]; if(!ss) return null; const st=stName(ss[d.si][0]);
  if(synOf(d.day,d.h,d.meal,d.si)) return null;   // a bar's dishes are its synthetic base's parts (and singles on their own)
  if(!isCafe(d.h)){ if(!NATURAL[st]) return null;
    if(st==='Noodle Bowl'){ if(d!==baseOf(d.day,d.h,d.meal,d.si)) return null; const parts=stDishes(d.day,d.h,d.meal,d.si).filter(x=>x!==d); return parts.length ? {head:st, parts, base:d, h:d.h, meal:d.meal} : null; }
    if(!isBaseAt(st,d)) return null;
    const parts=stDishes(d.day,d.h,d.meal,d.si).filter(x=>x!==d && !isBaseAt(st,x)); return parts.length ? {head:st, parts, base:d, h:d.h, meal:d.meal} : null; }
  if(/^(Add-ons|Toppings)$/.test(ss[d.si][0].trim())) return null;
  const parts=ss.flatMap((s2,si)=>/^(Add-ons|Toppings)$/.test(s2[0].trim()) ? stDishes(d.day,d.h,d.meal,si) : []).filter(x=>x.cal>0);
  const heads=[...new Set(ss.filter(s2=>/^(Add-ons|Toppings)$/.test(s2[0].trim())).map(s2=>s2[0].trim()))];
  return parts.length ? {head:heads.join(' and '), parts, base:d, h:d.h, meal:d.meal} : null; }
// every hall Noodle Bowl station-day, Oct 8-22, with its base and how many bases the UI offers (round 11's check; vectors)
function noodleBases(){ const out=[]; MD.forEach((D,day)=>HALLS.forEach(h=>Object.entries(D[h]||{}).forEach(([meal,ss])=>ss.forEach(([st],si)=>{ if(stName(st)!=='Noodle Bowl') return;
  const ds=stDishes(day,h,meal,si), b=baseOf(day,h,meal,si), y=synOf(day,h,meal,si);
  out.push({day:DAYS[day], h, meal, base:b?b.n:y.label, syn:!!y, n:(y?1:0)+ds.filter(d=>buildOf(d)||(ds.length===1&&d===b)).length}); })))); return out; }
const money = v => v==null ? null : '$'+v.toFixed(2);
const cents = s => s ? +s.replace(/[^\d.]/g,'') : 0;
// one dish-like object for a bowl: what the plate, the label, the log and Health read
function bowlDish(base, parts, syn, h){
  const all=[...(base?[[base,1]]:[]), ...parts], nut=Array(16).fill(null);
  for(const [x,q] of all) (x.nut||[]).forEach((v,i)=>{ if(NK[i].endsWith('Dv')||v==null) return; nut[i]=(nut[i]||0)+v*q; });
  const sum=k=>all.reduce((a,[x,q])=>a+x[k]*q,0), pr=all.reduce((a,[x,q])=>a+cents(x.price)*q,0), algs=[...new Set(all.flatMap(([x])=>x.algs||[]))].sort((a,b)=>ALG.indexOf(a)-ALG.indexOf(b));
  const key=(base?base.k:'syn:'+syn.label+':'+h)+'+'+parts.map(([x,q])=>x.k+'*'+q).sort().join('+');
  const src=base||syn;
  return {id:'bowl:'+key, k:'bowl:'+key, n:base?base.n:syn.label, cal:Math.round(sum('cal')), p:sum('p'), c:sum('c'), f:sum('f'), nut, d:base?base.d:0, h, meal:src.meal, day:0,
    srv:base?base.srv:'', price:pr?money(pr):null, alg:algs.join(', '), algs, hf:base?base.hf:null, cr:base?base.cr:null, ing:base?base.ing:'', base, syn, parts}; }
const withLine = parts => parts.length ? 'with '+parts.map(([x,q])=>(q!==1?fq(q)+' × ':'')+x.n).join(', ') : '';

// Scores (round 8b): tiles in the official app's family: a portrait rounded tile, a white pictogram, the value knocked into it.

// UMass Dining's Climate-Conscious Dining bands (My Emissions LCA), per kg of food. The feed carries only the letter.

  }
  const lr=t.closest('#isbody .lmeal .prow[data-li]'); if(lr){ if(t.closest('.inc')) stepLogged(+lr.dataset.li,1); else if(t.closest('.dec')) stepLogged(+lr.dataset.li,-1); return; }
  const mr=t.closest('[data-meal-id]'); if(mr){ openMeal(mr.dataset.mealId); return; }

    if(t.closest('.inc')) stepItem(pl,it,1); else if(t.closest('.dec')){

  else if(act==='sched') openSched();
  else if(act==='retry') retry();
  else if(act==='pin'){ const n=a.dataset.name, on=S.pins.includes(n); S.pins = on ? S.pins.filter(x=>x!==n) : [...S.pins, n]; save(); renderPins();
    a.setAttribute('aria-pressed',!on); a.setAttribute('aria-label',on?'Pin to Halls':'Unpin from Halls'); buzz(on?4:8); }
  else if(act==='fulllabel') openPlateLabel(a);

    if(inS){ S.sreveal=on; renderSearch(); } else { S.reveal=on; const y=$('#mscroll').scrollTop; renderMenuList(); $('#mscroll').scrollTop=y; A($('#mlist'),[{opacity:.4},{opacity:1}],'settle'); } buzz(4); }
